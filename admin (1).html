            if (!name) {
                showToastNotification('لطفاً نام مشتری را وارد کنید.');
                return;
            }
            if (valInput <= 0) {
                showToastNotification('لطفاً مبلغ یا دقیقه معتبر وارد کنید.');
                return;
            }

            const cust = ensureCustomerExists(name, phone);
            if (!cust) return;
            const now = new Date();
            const dayName = getPersianDayName(now);
            const shamsiDate = getShamsiDateString(now);
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

            if (kind === 'money_debt' || kind === 'money_credit') {
                const amount = roundToThousand(valInput);
                const isDebt = kind === 'money_debt';
                cust.moneyBalance = (Number(cust.moneyBalance) || 0) + (isDebt ? -amount : amount);
                cust.moneyLedger.unshift({
                    id: 'm_' + Date.now(),
                    type: isDebt ? 'debt' : 'credit',
                    amount: amount,
                    note: note || (isDebt ? 'ثبت دستی بدهی مالی' : 'ثبت دستی طلب مالی / شارژ'),
                    date: `${dayName} ${shamsiDate}`,
                    time: timeStr
                });
                showToastNotification(`${isDebt ? '📕 بدهکاری' : '💚 طلبکاری'} ${formatMoney(amount)} برای «${name}» ثبت شد.`);
            } else {
                const seconds = Math.round(valInput * 60);
                const isCredit = kind === 'time_credit';
                const devLabel = devType === 'ps4' ? 'PS4' : (devType === 'boardgame' ? 'بازی فکری' : (devType === 'foosball' ? 'فوتبال‌دستی' : 'ایرهاکی'));
                cust.debts.push({
                    id: 'time_' + Date.now(),
                    recordType: isCredit ? 'credit' : 'debt',
                    devId: '',
                    devName: devLabel,
                    devType: devType,
                    gameName: '',
                    customerName: name,
                    controllers: 1,
                    remainingSeconds: seconds,
                    note: note || (isCredit ? 'طلب زمان دستی' : 'بدهی زمان دستی'),
                    dayName: dayName,
                    shamsiDate: shamsiDate
                });
                showToastNotification(`⏳ ${valInput} دقیقه ${isCredit ? 'طلب زمان' : 'بدهکاری زمان'} برای «${name}» ثبت شد.`);
            }

            manualSaveAllData(true);
            renderTopLedgerBanner();
            openLedgerModal();
        }

        // --- Jalali (Shamsi) Calendar Math & Open/Closed Schedule Manager ---
        function jalaliToGregorian(jy, jm, jd) {
            jy += 1595;
            let days = -355668 + (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + jd;
            if (jm < 7) {
                days += (jm - 1) * 31;
            } else {
                days += ((jm - 7) * 30) + 186;
            }
            let gy = 400 * Math.floor(days / 146097);
            days %= 146097;
            if (days > 36524) {
                days--;
                gy += 100 * Math.floor(days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }
            gy += 4 * Math.floor(days / 1461);
            days %= 1461;
            if (days > 365) {
                gy += Math.floor((days - 1) / 365);
                days = (days - 1) % 365;
            }
            let gd = days + 1;
            const isLeapG = (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0);
            const salA = [0, 31, isLeapG ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let gm = 0;
            while (gm < 13 && gd > salA[gm]) {
                gd -= salA[gm];
                gm++;
            }
            return { gy, gm, gd };
        }

        function isJalaliLeapYear(jy) {
            return (((((jy - 474) % 2820) + 2820) % 2820 + 474 + 38) * 682) % 2816 < 682;
        }

        function getJalaliMonthDays(jy, jm) {
            if (jm <= 6) return 31;
            if (jm <= 11) return 30;
            return isJalaliLeapYear(jy) ? 30 : 29;
        }

        // Returns 0=شنبه, 1=یکشنبه, 2=دوشنبه, 3=سه‌شنبه, 4=چهارشنبه, 5=پنج‌شنبه, 6=جمعه
        function getJalaliWeekdayIndex(jy, jm, jd) {
            const { gy, gm, gd } = jalaliToGregorian(jy, jm, jd);
            const dt = new Date(gy, gm - 1, gd);
            return (dt.getDay() + 1) % 7;
        }

        function makeDateKey(jy, jm, jd) {
            return `${jy}-${String(jm).padStart(2, '0')}-${String(jd).padStart(2, '0')}`;
        }

        function isShamsiDateOpen(jy, jm, jd) {
            const key = makeDateKey(jy, jm, jd);
            if (Object.prototype.hasOwnProperty.call(dateOverrides, key)) {
                return !!dateOverrides[key];
            }
            const wIdx = getJalaliWeekdayIndex(jy, jm, jd);
            return openWeekdays.includes(wIdx);
        }

        // --- Online Customer Booking Portal Bridge (Unified Sanitized Public State & FIFO Approval Engine) ---
        window.buildSanitizedPublicBoard = function() {
            const nowMs = Date.now();
            const nowMin = getNowMinutes();
            const todayKey = getTodayDateKey();

            const publicDevices = devices.map(d => {
                let remainingSecs = 0;
                let estFreeTime = '';
                let actStart = typeof d.actualStartMin === 'number' ? d.actualStartMin : -1;
                let actEnd = typeof d.actualEndMin === 'number' ? d.actualEndMin : 0;
                let schedStart = typeof d.scheduledStartMin === 'number' ? d.scheduledStartMin : -1;
                let schedEnd = typeof d.scheduledEndMin === 'number' ? d.scheduledEndMin : 0;

                if (d.isActive) {
                    const liveInt = MacanScheduler.getActiveDeviceInterval(d, todayKey, nowMin);
                    if (liveInt) {
                        actStart = liveInt.actualStartMin;
                        actEnd = liveInt.actualEndMin;
                        schedStart = liveInt.scheduledStartMin;
                        schedEnd = liveInt.scheduledEndMin;
                        estFreeTime = liveInt.scheduledEndStr;
                    }
                    if (d.limitHours > 0) {
                        remainingSecs = Math.max(0, Math.round((d.limitHours * 3600) - d.elapsedSeconds));
                    }
                }
                return {
                    id: d.id,
                    name: d.name,
                    type: d.type,
                    isActive: !!d.isActive,
                    isPaused: !!d.isPaused,
                    limitHours: d.limitHours || 0,
                    remainingSeconds: remainingSecs,
                    estFreeTime: estFreeTime,
                    actualStartMin: actStart,
                    actualEndMin: actEnd,
                    scheduledStartMin: schedStart,
                    scheduledEndMin: schedEnd,
                    activeBookingId: d.activeBookingId || '',
                    gameName: d.type === 'boardgame' ? (d.gameName || '') : ''
                };
            });

            // Sanitized confirmed/active/recent walk-in & online bookings (NO customer names or phones exposed!)
            const publicReservations = reservations
                .map(r => MacanScheduler.normalizeExistingRecord(r))
                .filter(r => r && r.status !== 'cancelled' && r.status !== 'rejected')
                .map(r => {
                    const cleanP = MacanScheduler.normalizeDigits(r.phone || '').replace(/\D/g, '');
                    const tail10 = cleanP.length >= 10 ? cleanP.slice(-10) : cleanP;
                    return {
                        id: r.id,
                        devId: r.devId,
                        devName: r.devName || '',
                        date: r.date,
                        dateKey: r.dateKey,
                        bookingType: r.bookingType,
                        actualStartMin: r.actualStartMin,
                        actualEndMin: r.actualEndMin,
                        scheduledStartMin: r.scheduledStartMin,
                        scheduledEndMin: r.scheduledEndMin,
                        actualDurationMin: r.actualDurationMin,
                        selectedSlots: r.selectedSlots,
                        status: r.status,
                        trackingCode: r.trackingCode || '',
                        phoneTail10: tail10,
                        createdAt: r.createdAt,
                        timeStr: r.scheduledStartStr,
                        durationHours: r.durationHours
                    };
                });

            // Sanitized pending bookings so customer site paints those slots ORANGE (NO names or phones!)
            const publicPending = pendingCustomerBookings
                .map(p => MacanScheduler.normalizeExistingRecord({ ...p, status: 'pending' }))
                .filter(Boolean)
                .map(p => {
                    const cleanP = MacanScheduler.normalizeDigits(p.phone || '').replace(/\D/g, '');
                    const tail10 = cleanP.length >= 10 ? cleanP.slice(-10) : cleanP;
                    return {
                        id: p.id,
                        devId: p.devId,
                        devName: p.devName || '',
                        date: p.date,
                        dateKey: p.dateKey,
                        bookingType: 'online',
                        actualStartMin: p.actualStartMin,
                        actualEndMin: p.actualEndMin,
                        scheduledStartMin: p.scheduledStartMin,
                        scheduledEndMin: p.scheduledEndMin,
                        actualDurationMin: p.actualDurationMin,
                        selectedSlots: p.selectedSlots,
                        status: 'pending',
                        phoneTail10: tail10,
                        createdAt: p.createdAt
                    };
                });

            return {
                devices: publicDevices,
                reservations: publicReservations,
                pendingBookings: publicPending,
                dailyClosedWindows: dailyClosedWindows,
                deviceClosures: deviceClosures,
                operatingHours: operatingHours,
                schedulingRules: schedulingRules,
                rates: rates,
                azanTimeSetting: azanTimeSetting,
                openWeekdays: openWeekdays,
                dateOverrides: dateOverrides,
                updatedAt: nowMs
            };
        };

        window.handleIncomingCustomerBooking = function(req) {
            if (!req || !req.id) return;
            if (pendingCustomerBookings.some(p => p.id === req.id)) return;
            if (reservations.some(r => r.id === req.id)) return;

            const normReq = MacanScheduler.normalizeExistingRecord({
                ...req,
                bookingType: 'online',
                status: 'pending',
                createdAt: req.createdAt || Date.now()
            });
            if (!normReq) return;

            pendingCustomerBookings.push(normReq);
            // Keep FIFO time priority order (oldest first)
            pendingCustomerBookings.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

            try { localStorage.setItem('macan_pending_bookings', JSON.stringify(pendingCustomerBookings)); } catch (e) {}
            playChimeAlert();
            renderIncomingBookingsBanner();
            syncToCloud(); // Immediately broadcast updated orange pending slot to all clients
            showToastNotification(`🔔 درخواست رزرو جدید از ${normReq.customerName} (${normReq.scheduledStartStr} تا ${normReq.scheduledEndStr}) دریافت شد!`);
        };

        window.flushQueuedCustomerBookings = function() {
            try {
                const rawQueue = localStorage.getItem('macan_customer_booking_req_queue');
                if (!rawQueue) return;
                const queue = JSON.parse(rawQueue);
                if (!Array.isArray(queue) || queue.length === 0) return;
                const remaining = [];
                queue.forEach(req => {
                    if (!req || !req.id) return;
                    if (pendingCustomerBookings.some(p => p.id === req.id) || reservations.some(r => r.id === req.id)) {
                        return;
                    }
                    const normReq = MacanScheduler.normalizeExistingRecord({
                        ...req,
                        bookingType: 'online',
                        status: 'pending',
                        createdAt: req.createdAt || Date.now()
                    });
                    if (normReq) {
                        pendingCustomerBookings.push(normReq);
                    }
                });
                pendingCustomerBookings.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                try { localStorage.setItem('macan_pending_bookings', JSON.stringify(pendingCustomerBookings)); } catch (e) {}
                try { localStorage.setItem('macan_customer_booking_req_queue', JSON.stringify(remaining)); } catch (e) {}
                if (typeof renderIncomingBookingsBanner === 'function') renderIncomingBookingsBanner();
            } catch (e) {}
        };

        window.handleCustomerCancelledPending = function(reqId) {
            if (!reqId) return;
            const idx = pendingCustomerBookings.findIndex(p => p.id === reqId);
            if (idx === -1) return;
            const cancelled = pendingCustomerBookings[idx];
            pendingCustomerBookings.splice(idx, 1);
            try { localStorage.setItem('macan_pending_bookings', JSON.stringify(pendingCustomerBookings)); } catch (e) {}
            renderIncomingBookingsBanner();
            syncToCloud();
            showToastNotification(`ℹ️ مشتری (${cancelled.customerName || 'کاربر'}) درخواست رزرو خود را لغو کرد.`);
        };

        window.handleCustomerPhoneLookup = function(req) {
            if (!req || !req.phone || !req.queryId) return;
            const targetPhone = normalizePhoneDigits(req.phone);
            if (!targetPhone || targetPhone.length < 7) return;

            const matchedConfirmed = reservations
                .map(r => MacanScheduler.normalizeExistingRecord(r))
                .filter(r => r && r.status !== 'cancelled' && r.status !== 'rejected' && phonesMatch(r.phone, targetPhone))
                .map(r => ({
                    ...r,
                    status: r.status === 'confirmed' ? 'approved' : r.status
                }));

            const matchedPending = pendingCustomerBookings
                .map(p => MacanScheduler.normalizeExistingRecord({ ...p, status: 'pending' }))
                .filter(p => p && phonesMatch(p.phone, targetPhone));

            const packet = {
                queryId: req.queryId,
                phone: targetPhone,
                bookings: [...matchedConfirmed, ...matchedPending]
            };

            if (window.cloudSync && window.cloudSync.mqttClient && window.cloudSync.mqttClient.connected) {
                try {
                    const { phoneLookupRespTopic } = window.cloudSync.getTopics();
                    window.cloudSync.mqttClient.publish(phoneLookupRespTopic, JSON.stringify(packet), { qos: 1 });
                } catch (e) {}
            }
        };

                bar.classList.add('hidden');
                list.innerHTML = '';
                return;
            }

            // Strictly sort by FIFO createdAt ascending
            pendingCustomerBookings.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

            bar.classList.remove('hidden');
            if (badge) badge.textContent = String(pendingCustomerBookings.length);

            const ctx = getSchedulerContext();

            list.innerHTML = pendingCustomerBookings.map((rawReq, idx) => {
                const req = MacanScheduler.normalizeExistingRecord({ ...rawReq, status: 'pending' });
                const dev = devices.find(d => d.id === req.devId);

                const slotsCount = Array.isArray(req.selectedSlots) && req.selectedSlots.length > 0 ? req.selectedSlots.length : Math.max(1, Math.round(req.actualDurationMin / 30));

                const check = MacanScheduler.checkConflict(req, ctx, { ignoreBookingId: req.id, isAdminApproval: true });
                const canApprove = !check.conflict;

                return `

                            </div>
                            ${!canApprove ? `<div class="text-[10px] font-bold text-rose-300 bg-rose-950/60 border border-rose-500/40 px-2 py-1 rounded-lg">⛔ ${check.message}</div>` : ''}

                        <div class="flex items-center gap-2">

                                ✅ تأیید و ثبت رزرو
                            </button>
                            <button onclick="rejectCustomerBooking('${req.id}')" class="px-3 py-1.5 bg-rose-600/30 hover:bg-rose-600 text-rose-200 hover:text-white font-bold rounded-xl cursor-pointer">
                                ✕ رد درخواست
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

        function approveCustomerBooking(reqId) {
            const idx = pendingCustomerBookings.findIndex(r => r.id === reqId);
            if (idx === -1) return;
            const normReq = MacanScheduler.normalizeExistingRecord({ ...pendingCustomerBookings[idx], status: 'pending' });

            // Final central conflict & FIFO priority validation before confirming!
            const check = MacanScheduler.checkConflict(normReq, getSchedulerContext(), { ignoreBookingId: normReq.id, isAdminApproval: true });
            if (check.conflict) {
                showToastNotification('⛔ ' + check.message);
                renderIncomingBookingsBanner();
                return;
            }

            pendingCustomerBookings.splice(idx, 1);

            const trackingCode = 'MCN-' + String(Math.floor(1000 + Math.random() * 9000));
            const confirmedRec = {
                ...normReq,
                status: 'confirmed',
                trackingCode: trackingCode
            };
            reservations.push(confirmedRec);

            registerCustomerToDB(confirmedRec.customerName, confirmedRec.phone || '');
            try { localStorage.setItem('macan_pending_bookings', JSON.stringify(pendingCustomerBookings)); } catch (e) {}

            if (window.cloudSync && typeof window.cloudSync.sendBookingDecision === 'function') {
                window.cloudSync.sendBookingDecision({
                    requestId: confirmedRec.id,
                    status: 'approved',
                    trackingCode: trackingCode,
                    devName: confirmedRec.devName || '',
                    date: confirmedRec.date,
                    dateKey: confirmedRec.dateKey,
                    timeStr: confirmedRec.scheduledStartStr,
                    scheduledStartStr: confirmedRec.scheduledStartStr,
                    scheduledEndStr: confirmedRec.scheduledEndStr,
                    actualDurationMin: confirmedRec.actualDurationMin,
                    durationHours: confirmedRec.durationHours
                });
            }

            manualSaveAllData(true);
            renderIncomingBookingsBanner();
            renderAllDevices();
            showApprovedSmsHelper(confirmedRec);
            showToastNotification(`✅ رزرو ${confirmedRec.customerName} تأیید شد (${confirmedRec.scheduledStartStr} تا ${confirmedRec.scheduledEndStr} | کد: ${trackingCode}).`);
        }

        function showApprovedSmsHelper(rec) {
            const bar = document.getElementById('approved-sms-helper-bar');
            if (!bar || !rec) return;
            const cleanPhone = MacanScheduler.normalizeDigits(rec.phone || '').replace(/\s+/g, '');

            const weekFullNames = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه'];
            const normKey = MacanScheduler.normalizeDateKey(rec.dateKey || rec.date);
            let weekdayName = '';
            const km = normKey.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (km) {
                const wIdx = getJalaliWeekdayIndex(parseInt(km[1], 10), parseInt(km[2], 10), parseInt(km[3], 10));
                weekdayName = weekFullNames[wIdx] || '';
            }
            const dayPhrase = weekdayName ? `برای روز ${weekdayName}` : '';
            const dateDisplay = weekdayName ? `${weekdayName} (${rec.date})` : rec.date;

            const smsText = [
                `سلام ${rec.customerName} عزیز 👋`,
                `رزرو شما در بازی‌کده ماکان ${dayPhrase} ثبت و تأیید شد ✅`,
                ``,
                `🎮 بخش: ${rec.devName}`,
                `📅 روز و تاریخ: ${dateDisplay}`,
                `🕒 ساعت: ${rec.scheduledStartStr} تا ${rec.scheduledEndStr}`,
                ``,
                `منتظر دیدار شما هستیم ✨`
            ].join('\n');

            const encodedSms = encodeURIComponent(smsText);
            const smsHref = cleanPhone ? `sms:${cleanPhone}?body=${encodedSms}` : `sms:?body=${encodedSms}`;

            bar.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="space-y-0.5">
                        <div class="font-black text-emerald-400">✅ رزرو ${rec.customerName} ${dayPhrase} تأیید شد</div>
                        <div class="text-[11px] text-slate-300">برای ارسال پیامک به مشتری (<span dir="ltr" class="font-mono text-cyan-300">${cleanPhone || 'بدون شماره'}</span>) دکمه زیر را بزنید:</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="${smsHref}" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow text-[11px] inline-flex items-center gap-1.5">
                            <span>📩 ارسال پیامک تأیید</span>
                        </a>
                        <button type="button" onclick="copyApprovedSmsText(this)" data-sms-enc="${encodedSms}" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold rounded-xl text-[11px] cursor-pointer">
                            کپی متن
                        </button>
                        <button type="button" onclick="document.getElementById('approved-sms-helper-bar').classList.add('hidden')" class="px-2 py-1.5 text-slate-400 hover:text-white font-bold cursor-pointer">✕</button>
                    </div>
                </div>
            `;
            bar.classList.remove('hidden');
        }

        async function copyApprovedSmsText(btn) {
            const enc = btn ? btn.getAttribute('data-sms-enc') : '';
            if (!enc) return;
            const txt = decodeURIComponent(enc);
            try {
                await navigator.clipboard.writeText(txt);
                showToastNotification('📋 متن پیامک تأیید کپی شد.');
            } catch (e) {
                window.prompt('متن پیامک تأیید را کپی کنید:', txt);
            }
        }

                    pillHtml = `<span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-500/20 text-rose-300 animate-pulse">اتمام زمان</span>`;
                } else if (dev.isActive && dev.isPaused) {
                    const dispTime = dev.limitHours > 0
                        ? formatTime(Math.max(0, (dev.limitHours * 3600) - dev.elapsedSeconds))

                    borderAccent = 'border-amber-500/55 hover:border-amber-400';
                    pillHtml = `<span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-amber-500/15 text-amber-300">متوقف • ${dispTime}</span>`;
                } else if (dev.isActive) {
                    const dispTime = dev.limitHours > 0
                        ? formatTime(Math.max(0, (dev.limitHours * 3600) - dev.elapsedSeconds))
                        : formatTime(dev.elapsedSeconds);
                    borderAccent = 'border-emerald-500/60 hover:border-emerald-400 shadow-[0_0_16px_-4px_rgba(16,185,129,0.35)]';
                    pillHtml = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-black bg-emerald-500/20 text-emerald-300"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>${dispTime}</span>`;

                        <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 group-hover:border-cyan-500/40 flex items-center justify-center">
                            ${getAdminCompactDeviceIcon(dev.type)}

                `;

                if (dev.type === 'ps4') _tmp.ps4.innerHTML += tileHtml;
                else if (dev.type === 'boardgame') _tmp.board.innerHTML += tileHtml;
                else _tmp.table.innerHTML += tileHtml;
            });
            morphChildren(ps4Grid, _tmp.ps4);
            morphChildren(tablesGrid, _tmp.table);
            morphChildren(boardgameGrid, _tmp.board);
        }

        // --- Window OnLoad & Persistence Initialization ---
        window.onload = function() {
            try {
                const savedDevices = localStorage.getItem('macan_devices_state');
                if (savedDevices) {
                    const parsedDevs = JSON.parse(savedDevices);
                    parsedDevs.forEach(savedDev => {
                        const target = devices.find(d => d.id === savedDev.id);
                        if (target) Object.assign(target, savedDev);
                    });
                }

                const savedLogs = localStorage.getItem('macan_completed_logs');
                if (savedLogs) completedLogs = JSON.parse(savedLogs);

                const savedCust = localStorage.getItem('macan_customers_db');
                if (savedCust) customerDatabase = JSON.parse(savedCust);

                const savedRes = localStorage.getItem('macan_reservations');
                if (savedRes) reservations = JSON.parse(savedRes);

                const savedPending = localStorage.getItem('macan_pending_bookings');
                if (savedPending) pendingCustomerBookings = JSON.parse(savedPending);

                backfillCustomerDatabaseFromHistory();

                window.addEventListener('storage', (ev) => {
                    if (ev.key === 'macan_customer_booking_request_broadcast' && ev.newValue) {
                        try {
                            const req = JSON.parse(ev.newValue);
                            if (req && req.id) window.handleIncomingCustomerBooking(req);
                        } catch (err) {}
                    }
                    if (ev.key === 'macan_customer_booking_cancel_broadcast' && ev.newValue) {
                        try {
                            const data = JSON.parse(ev.newValue);
                            if (data && data.requestId) window.handleCustomerCancelledPending(data.requestId);
                        } catch (err) {}
                    }
                });

                const savedRates = localStorage.getItem('macan_rates');
                if (savedRates) rates = JSON.parse(savedRates);

                const savedBuffet = localStorage.getItem('macan_buffet_catalog');
                if (savedBuffet) buffetCatalog = JSON.parse(savedBuffet);

                const savedNote = localStorage.getItem('macan_quick_note');
                if (savedNote) {
                    quickNoteText = savedNote;
                    const noteInput = document.getElementById('manager-quick-note');
                    if (noteInput) noteInput.value = savedNote;
                }

                const savedTheme = localStorage.getItem('macan_theme');
                if (savedTheme === 'light') toggleAppTheme();

                const savedIcon = localStorage.getItem('macan_header_icon_v5');
                if (savedIcon) {
                    currentHeaderIcon = savedIcon;
                    if (savedIcon === 'custom') customHeaderIconUrl = localStorage.getItem('macan_custom_header_icon');
                }
                renderHeaderIcon();

                const savedAzan = localStorage.getItem('macan_azan_time');
                if (savedAzan) updateAzanTimeSetting(savedAzan);

                const savedOpenW = localStorage.getItem('macan_open_weekdays');
                if (savedOpenW) {
                    const parsedW = JSON.parse(savedOpenW);
                    if (Array.isArray(parsedW)) openWeekdays = parsedW;
                }
                const savedOverrides = localStorage.getItem('macan_date_overrides');
                if (savedOverrides) {
                    const parsedO = JSON.parse(savedOverrides);
                    if (parsedO && typeof parsedO === 'object') dateOverrides = parsedO;
                }
                const savedDailyW = localStorage.getItem('macan_daily_closed_windows');
                if (savedDailyW) {
                    const parsedDW = JSON.parse(savedDailyW);
                    if (Array.isArray(parsedDW)) dailyClosedWindows = parsedDW;
                }
                const savedClosures = localStorage.getItem('macan_device_closures');
                if (savedClosures) {
                    const parsedC = JSON.parse(savedClosures);
                    if (Array.isArray(parsedC)) deviceClosures = parsedC;
                }
                const savedOpHrs = localStorage.getItem('macan_operating_hours_v2');
                if (savedOpHrs) {
                    const parsedH = JSON.parse(savedOpHrs);
                    if (parsedH && typeof parsedH.openMin === 'number' && typeof parsedH.closeMin === 'number') operatingHours = parsedH;
                }
                const savedRules = localStorage.getItem('macan_scheduling_rules');
                if (savedRules) {
                    const parsedR = JSON.parse(savedRules);
                    if (parsedR && typeof parsedR === 'object') schedulingRules = parsedR;
                }
                reservations = reservations.map(r => MacanScheduler.normalizeExistingRecord(r)).filter(Boolean);
                pendingCustomerBookings = pendingCustomerBookings.map(p => MacanScheduler.normalizeExistingRecord({ ...p, status: p.status || 'pending' })).filter(Boolean);
                const tpNow = getShamsiParts();
                adminCalViewYear = tpNow.year;
                adminCalViewMonth = tpNow.month;

                const savedPresets = localStorage.getItem('macan_duration_presets');
                if (savedPresets) {
                    const parsedPresets = JSON.parse(savedPresets);
                    if (Array.isArray(parsedPresets) && parsedPresets.length > 0) {
                        durationPresets = parsedPresets;
                    }
                }
            } catch (e) {
                console.log('Storage load error', e);
            }

            renderAllDevices();
            setInterval(updateLiveClock, 1000);
            updateLiveClock();

            try {
                const params = new URLSearchParams(window.location.search);
                const roomParam = params.get('room');
                if (roomParam && window.cloudSync) {
                    window.cloudSync.connectRoom(roomParam);
                }
            } catch (e) {}
        };
    </script>
    <script>
        function dismissBrandSplash() {
            const sp = document.getElementById('brand-splash');
            if (!sp) return;
            sp.classList.add('out');
            setTimeout(() => sp.remove(), 480);
        }
        (function() {
            let seen = false;
            try { seen = sessionStorage.getItem('macan_splash_seen') === '1'; } catch (e) {}
            if (seen) {
                const sp = document.getElementById('brand-splash');
                if (sp) sp.remove();
            } else {
                try { sessionStorage.setItem('macan_splash_seen', '1'); } catch (e) {}
                setTimeout(dismissBrandSplash, 650);
            }
        })();

        function toggleNavDrawer(force) {
            const n = document.querySelector('.bottom-nav');
            if (!n) return;
            const o = typeof force === 'boolean' ? force : !n.classList.contains('open');
            n.classList.toggle('open', o);
            document.getElementById('nav-backdrop')?.classList.toggle('open', o);
        }
        document.addEventListener('click', function(e) {
            if (e.target.closest('.bottom-nav .drawer-item')) setTimeout(function() { toggleNavDrawer(false); }, 60);
        });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') toggleNavDrawer(false); });
    </script>
    <script>
        function morphNode(o, n) {
            if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) { o.replaceWith(n); return; }
            if (o.nodeType === 3 || o.nodeType === 8) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }
            Array.from(o.attributes).forEach(function(a) { if (!n.hasAttribute(a.name)) o.removeAttribute(a.name); });
            Array.from(n.attributes).forEach(function(a) { if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value); });
            morphChildren(o, n);
        }
        function morphChildren(o, n) {
            var oc = Array.from(o.childNodes), nc = Array.from(n.childNodes), m = Math.min(oc.length, nc.length), i;
            for (i = 0; i < m; i++) morphNode(oc[i], nc[i]);
            for (i = m; i < nc.length; i++) o.appendChild(nc[i]);
            for (i = oc.length - 1; i >= m; i--) o.removeChild(oc[i]);
        }
        function morphInto(el, html) { var tmp = document.createElement('div'); tmp.innerHTML = html; morphChildren(el, tmp); }
    </script>
    <script>
        (function() {
            var sheet = null;
            var CHEV = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
            var CHECK = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
            function closeDD() { if (sheet) { sheet.remove(); sheet = null; } }
            function label(sel) { var o = sel.options[sel.selectedIndex]; return o ? o.textContent.trim() : ''; }
            function openDD(sel, sync) {
                closeDD();
                sheet = document.createElement('div');
                sheet.className = 'fixed inset-0 flex items-end justify-center';
                sheet.style.zIndex = 200;
                var inner = document.createElement('div');
                inner.className = 'w-full max-w-md p-4 pt-6';
                var list = document.createElement('div');
                list.className = 'dd-list';
                Array.prototype.forEach.call(sel.options, function(o, i) {
                    var r = document.createElement('button');
                    r.type = 'button';
                    r.className = 'dd-opt' + (i === sel.selectedIndex ? ' on' : '');
                    var s = document.createElement('span'); s.textContent = o.textContent.trim(); r.appendChild(s);
                    if (i === sel.selectedIndex) r.insertAdjacentHTML('beforeend', CHECK);
                    r.addEventListener('click', function() {
                        sel.selectedIndex = i;
                        sel.dispatchEvent(new Event('change', { bubbles: true }));
                        sync(); closeDD();
                    });
                    list.appendChild(r);
                });
                inner.appendChild(list); sheet.appendChild(inner);
                sheet.addEventListener('click', function(e) { if (e.target === sheet) closeDD(); });
                document.body.appendChild(sheet);
                var on = list.querySelector('.on'); if (on) on.scrollIntoView({ block: 'center' });
            }
            var enhanced = [];
            function enhance(sel) {
                if (sel.dataset.dd || sel.multiple) return;
                sel.dataset.dd = '1';
                var b = document.createElement('button');
                b.type = 'button';
                b.className = sel.className + ' dd-btn';
                b.innerHTML = '<span></span>' + CHEV;
                sel.style.display = 'none';
                sel.insertAdjacentElement('afterend', b);
                function sync() { var v = label(sel); if (b.firstChild.textContent !== v) b.firstChild.textContent = v; }
                sync();
                sel.addEventListener('change', sync);
                b.addEventListener('click', function() { openDD(sel, sync); });
                enhanced.push({ sel: sel, b: b, sync: sync });
            }
            function scan() { document.querySelectorAll('select:not([data-dd])').forEach(enhance); }
            new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
            setInterval(function() {
                enhanced = enhanced.filter(function(x) { return document.body.contains(x.sel); });
                enhanced.forEach(function(x) { x.sync(); });
            }, 500);
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDD(); });
            scan();
        })();
    </script>

    <script>
        // ---- Connect with customer booking page (index.html) ----
        function getCustomerUrl() {
            let room = '';
            try { room = (localStorage.getItem('macan_sync_room_code') || '').trim(); } catch (e) {}
            const u = new URL('index.html', location.href);
            if (room) u.searchParams.set('room', room);
            return u.toString();
        }
        function goCustomerPage() { location.href = getCustomerUrl(); }
        async function copyCustomerLink() {
            const url = getCustomerUrl();
            const label = document.getElementById('copy-customer-link-text');
            try {
                await navigator.clipboard.writeText(url);
                if (label) { label.textContent = '✅ لینک کپی شد'; setTimeout(() => { label.textContent = 'کپی لینک رزرو برای مشتری'; }, 2000); }
            } catch (e) {
                window.prompt('لینک رزرو مشتریان را کپی کنید:', url);
            }
        }
        (function () {
            const l = document.getElementById('customer-page-link');
            if (l) l.addEventListener('click', function () { this.href = getCustomerUrl(); });
        })();
    </script>

    <script>
        (function () {
            function hydrateAdminFromStorage() {
                try {
                    const sDevs = localStorage.getItem('macan_devices_state');
                    if (sDevs) {
                        const p = JSON.parse(sDevs);
                        if (Array.isArray(p)) {
                            p.forEach(rd => {
                                const ld = devices.find(d => d.id === rd.id);
                                if (ld) Object.assign(ld, rd);
                            });
                        }
                    }
                    const sLogs = localStorage.getItem('macan_completed_logs');
                    if (sLogs) { const p = JSON.parse(sLogs); if (Array.isArray(p)) completedLogs = p; }
                    const sRes = localStorage.getItem('macan_reservations');
                    if (sRes) { const p = JSON.parse(sRes); if (Array.isArray(p)) reservations = p; }
                    const sPend = localStorage.getItem('macan_pending_bookings');
                    if (sPend) { const p = JSON.parse(sPend); if (Array.isArray(p)) pendingCustomerBookings = p; }
                    const sCust = localStorage.getItem('macan_customers_db');
                    if (sCust) { const p = JSON.parse(sCust); if (p && typeof p === 'object') customerDatabase = p; }
                    const sRates = localStorage.getItem('macan_rates');
                    if (sRates) { const p = JSON.parse(sRates); if (p && typeof p === 'object') rates = p; }
                    const sBuff = localStorage.getItem('macan_buffet_catalog');
                    if (sBuff) { const p = JSON.parse(sBuff); if (Array.isArray(p)) buffetCatalog = p; }
                    const sAzan = localStorage.getItem('macan_azan_time');
                    if (sAzan) {
                        azanTimeSetting = sAzan;
                        const ae = document.getElementById('azan-time-text');
                        if (ae) ae.innerText = azanTimeSetting;
                    }
                    const sNote = localStorage.getItem('macan_quick_note');
                    if (typeof sNote === 'string') {
                        quickNoteText = sNote;
                        const ne = document.getElementById('manager-quick-note');
                        if (ne) ne.value = quickNoteText;
                    }
                    const sLoginPass = localStorage.getItem('macan_admin_login_password');
                    if (sLoginPass) adminLoginPassword = sLoginPass;
                    const sTheme = localStorage.getItem('macan_theme');
                    if (sTheme === 'light') {
                        currentTheme = 'light';
                        document.body.classList.add('light-theme');
                    }
                } catch (e) {}
            }

            function bootAdminUI() {
                hydrateAdminFromStorage();
                if (typeof renderHeaderIcon === 'function') renderHeaderIcon();
                if (typeof updateLiveClock === 'function') updateLiveClock();
                if (typeof renderAllDevices === 'function') renderAllDevices();
                if (typeof window.flushQueuedCustomerBookings === 'function') window.flushQueuedCustomerBookings();
                if (typeof renderIncomingBookingsBanner === 'function') renderIncomingBookingsBanner();
                if (typeof renderUnifiedTopStrip === 'function') renderUnifiedTopStrip();
                setInterval(() => {
                    if (typeof updateLiveClock === 'function') updateLiveClock();
                    if (typeof window.flushQueuedCustomerBookings === 'function') window.flushQueuedCustomerBookings();
                }, 1000);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bootAdminUI);
            } else {
                bootAdminUI();
            }
            window.addEventListener('focus', () => {
                if (typeof window.flushQueuedCustomerBookings === 'function') window.flushQueuedCustomerBookings();
                if (typeof renderIncomingBookingsBanner === 'function') renderIncomingBookingsBanner();
            });
        })();
    </script>
