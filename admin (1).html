    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.cloudSync = {
            db: null,
            auth: null,
            user: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'macan-gamenet-live',
            roomCode: (new URLSearchParams(window.location.search).get('room') || localStorage.getItem('macan_sync_room_code') || 'macan-live-1').trim().toLowerCase(),
            sessionId: 'staff_' + Math.random().toString(36).substring(2, 10),
            isApplyingRemote: false,
            onlineCount: 1,
            peersMap: {},
            unsubPresence: null,
            unsubState: null,
            channel: null,
            mqttClient: null,
            cloudAvailable: false,
            lastKnownStateTimestamp: 0,
            heartbeatTimer: null,
            syncRetryTimer: null,

            async init() {
                // 1. Local Multi-Tab Instant BroadcastChannel & Storage Sync
                try {
                    if ('BroadcastChannel' in window) {
                        this.channel = new BroadcastChannel('macan_gamenet_channel_' + this.roomCode);
                        this.channel.onmessage = (ev) => {
                            if (!ev.data) return;
                            if (ev.data.type === 'booking_req' && ev.data.payload) {
                                if (typeof window.handleIncomingCustomerBooking === 'function') {
                                    window.handleIncomingCustomerBooking(ev.data.payload);
                                }
                                return;
                            }
                            if (ev.data.type === 'booking_cancel' && ev.data.requestId) {
                                if (typeof window.handleCustomerCancelledPending === 'function') {
                                    window.handleCustomerCancelledPending(ev.data.requestId);
                                }
                                return;
                            }
                            if (ev.data.updatedBy !== this.sessionId) {
                                this.applyIncomingData(ev.data);
                            }
                        };
                    }
                    window.addEventListener('storage', (e) => {
                        if (!e.newValue) return;
                        if (e.key === 'macan_shared_broadcast_packet') {
                            try {
                                const parsed = JSON.parse(e.newValue);
                                if (parsed && parsed.updatedBy !== this.sessionId) {
                                    this.applyIncomingData(parsed);
                                }
                            } catch (err) {}
                        } else if (e.key === 'macan_customer_booking_request_broadcast') {
                            try {
                                const req = JSON.parse(e.newValue);
                                if (req && req.id && typeof window.handleIncomingCustomerBooking === 'function') {
                                    window.handleIncomingCustomerBooking(req);
                                }
                            } catch (err) {}
                        } else if (e.key === 'macan_customer_booking_cancel_broadcast') {
                            try {
                                const data = JSON.parse(e.newValue);
                                if (data && data.requestId && typeof window.handleCustomerCancelledPending === 'function') {
                                    window.handleCustomerCancelledPending(data.requestId);
                                }
                            } catch (err) {}
                        } else if (e.key === 'macan_pending_bookings') {
                            try {
                                const list = JSON.parse(e.newValue);
                                if (Array.isArray(list)) {
                                    pendingCustomerBookings = list;
                                    if (typeof renderIncomingBookingsBanner === 'function') renderIncomingBookingsBanner();
                                }
                            } catch (err) {}
                        }
                    });
                } catch (e) {}

                // 2. Firebase Firestore Multi-Phone Live Sync (When running inside hosted Preview)
                try {
                    let firebaseConfig = null;
                    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                        firebaseConfig = JSON.parse(__firebase_config);
                    }

                    if (firebaseConfig) {
                        const app = initializeApp(firebaseConfig);
                        this.auth = getAuth(app);
                        this.db = getFirestore(app);

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(this.auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(this.auth);
                        }
                        this.user = this.auth.currentUser;
                        if (this.user) {
                            this.cloudAvailable = true;
                            this.updateSyncStatusUI('🟢 متصل به سرور زنده');
                            this.connectRoom(this.roomCode);
                            return;
                        }
                    }
                } catch (err) {
                    console.log('Firebase fallback to WebSocket relay:', err);
                }

                // 3. Real-Time Multi-Broker WebSocket Relay (Works on Chrome / Eitaa / Local HTML without CORS blocks)
                this.startWebSocketSync();

                // Re-sync automatically when phone screen wakes up or tab becomes visible
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        this.requestLatestFromPeers();
                    }
                });
                window.addEventListener('focus', () => {
                    this.requestLatestFromPeers();
                });
            },

            getTopics() {
                const safeRoom = this.roomCode.replace(/[^a-z0-9_-]/g, '_');
                return {
                    stateTopic: `macan_gamenet_live_v3/${safeRoom}/state`,
                    presenceTopic: `macan_gamenet_live_v3/${safeRoom}/presence`,
                    requestTopic: `macan_gamenet_live_v3/${safeRoom}/request`,
                    publicBoardTopic: `macan_gamenet_live_v3/${safeRoom}/public_board`,
                    bookingReqTopic: `macan_gamenet_live_v3/${safeRoom}/booking_req`,
                    bookingRespTopic: `macan_gamenet_live_v3/${safeRoom}/booking_resp`,
                    bookingCancelTopic: `macan_gamenet_live_v3/${safeRoom}/booking_cancel`,
                    phoneLookupReqTopic: `macan_gamenet_live_v3/${safeRoom}/phone_lookup_req`,
                    phoneLookupRespTopic: `macan_gamenet_live_v3/${safeRoom}/phone_lookup_resp`
                };
            },

            requestLatestFromPeers() {
                if (this.mqttClient && this.mqttClient.connected) {
                    const { presenceTopic, requestTopic } = this.getTopics();
                    this.mqttClient.publish(presenceTopic, JSON.stringify({
                        sessionId: this.sessionId,
                        ts: Date.now(),
                        status: 'online'
                    }), { qos: 0 });

                    this.mqttClient.publish(requestTopic, JSON.stringify({
                        requesterId: this.sessionId,
                        ts: Date.now()
                    }), { qos: 1 });
                }
            },

            startWebSocketSync() {
                if (this.mqttClient) {
                    try { this.mqttClient.end(true); } catch (e) {}
                    this.mqttClient = null;
                }
                if (this.heartbeatTimer) {
                    clearInterval(this.heartbeatTimer);
                    this.heartbeatTimer = null;
                }
                if (this.syncRetryTimer) {
                    clearInterval(this.syncRetryTimer);
                    this.syncRetryTimer = null;
                }

                this.peersMap = {};
                this.peersMap[this.sessionId] = Date.now();
                this.updateSyncStatusUI('🟡 در حال اتصال به شبکه زنده...');

                if (typeof mqtt === 'undefined') {
                    this.updateSyncStatusUI('🔴 کتابخانه اتصال بارگذاری نشد (اینترنت را بررسی کنید)');
                    return;
                }

                // Detect restricted sandboxed iframe environments where external WebSockets are blocked (allow file:// local storage)
                const isSandboxedOrigin = window.location.protocol === 'about:' ||
                                          window.location.hostname.includes('usercontent') ||
                                          window.location.hostname.includes('webcontainer');

                if (isSandboxedOrigin) {
                    this.updateSyncStatusUI('🟢 همگام‌سازی محلی فعال (برای اتصال چند گوشی، فایل را در مرورگر کروم باز کنید)');
                    return;
                }

                const { stateTopic, presenceTopic, requestTopic, bookingReqTopic, bookingCancelTopic, phoneLookupReqTopic } = this.getTopics();

                const brokers = [
                    'wss://broker.emqx.io:8084/mqtt',
                    'wss://broker.hivemq.com:8884/mqtt',
                    'wss://test.mosquitto.org:8081/mqtt'
                ];
                let brokerIndex = 0;

                const connectBroker = (url) => {
                    let client;
                    try {
                        client = mqtt.connect(url, {
                            clientId: 'macan_' + Math.random().toString(16).substring(2, 10),
                            clean: true,
                            connectTimeout: 8000,
                            reconnectPeriod: 2500
                        });
                    } catch (secErr) {
                        this.updateSyncStatusUI('🟢 حالت محلی فعال (بدون خطای امنیتی)');
                        return;
                    }

                    client.on('connect', () => {
                        this.mqttClient = client;
                        this.cloudAvailable = true;
                        this.updateSyncStatusUI('🟢 متصل به سرور زنده (همگام‌سازی فعال)');

                        client.subscribe([stateTopic, presenceTopic, requestTopic, bookingReqTopic, bookingCancelTopic, phoneLookupReqTopic], { qos: 1 }, () => {
                            if (typeof window.flushQueuedCustomerBookings === 'function') {
                                window.flushQueuedCustomerBookings();
                            }
                            // Immediately announce presence, request latest state, and publish public board for customer booking page
                            this.requestLatestFromPeers();
                            if (typeof window.syncToCloud === 'function') {
                                window.syncToCloud();
                            }

                            // Retry requesting state after 1.5s & 3.5s in case phone was just refreshed
                            let retryCount = 0;
                            this.syncRetryTimer = setInterval(() => {
                                retryCount++;
                                this.requestLatestFromPeers();
                                if (retryCount >= 3) {
                                    clearInterval(this.syncRetryTimer);
                                    this.syncRetryTimer = null;
                                }
                            }, 1500);
                        });

                        // Periodic presence heartbeat every 4 seconds
                        this.heartbeatTimer = setInterval(() => {
                            if (!this.mqttClient || !this.mqttClient.connected) return;
                            const now = Date.now();
                            this.peersMap[this.sessionId] = now;

                            this.mqttClient.publish(presenceTopic, JSON.stringify({
                                sessionId: this.sessionId,
                                ts: now,
                                status: 'online'
                            }), { qos: 0 });

                            let count = 0;
                            for (const sid in this.peersMap) {
                                if (now - this.peersMap[sid] < 14000) {
                                    count++;
                                } else {
                                    delete this.peersMap[sid];
                                }
                            }
                            this.onlineCount = Math.max(1, count);
                            if (typeof window.updateOnlineBadgeUI === 'function') {
                                window.updateOnlineBadgeUI(this.onlineCount);
                            }
                        }, 4000);
                    });

                    client.on('message', (topic, message, packet) => {
                        try {
                            const raw = message.toString();
                            const data = JSON.parse(raw);

                            if (topic === presenceTopic && data && data.sessionId) {
                                if (data.status === 'offline') {
                                    delete this.peersMap[data.sessionId];
                                } else {
                                    this.peersMap[data.sessionId] = Date.now();
                                }
                                const now = Date.now();
                                let count = 0;
                                for (const sid in this.peersMap) {
                                    if (now - this.peersMap[sid] < 14000) count++;
                                }
                                this.onlineCount = Math.max(1, count);
                                if (typeof window.updateOnlineBadgeUI === 'function') {
                                    window.updateOnlineBadgeUI(this.onlineCount);
                                }
                            } else if (topic === requestTopic && data && data.requesterId !== this.sessionId) {
                                // Another phone just refreshed or opened! Send our current state to it immediately
                                if (typeof window.syncToCloud === 'function') {
                                    window.syncToCloud();
                                }
                            } else if (topic === stateTopic && data && data.updatedBy !== this.sessionId) {
                                // Apply state even if it is a retained broker packet from our own previous refresh
                                this.applyIncomingData(data);
                            } else if (topic === bookingReqTopic && data && data.id) {
                                if (typeof window.handleIncomingCustomerBooking === 'function') {
                                    window.handleIncomingCustomerBooking(data);
                                }
                            } else if (topic === bookingCancelTopic && data && data.requestId) {
                                if (typeof window.handleCustomerCancelledPending === 'function') {
                                    window.handleCustomerCancelledPending(data.requestId);
                                }
                            } else if (topic === phoneLookupReqTopic && data && data.phone && data.queryId) {
                                if (typeof window.handleCustomerPhoneLookup === 'function') {
                                    window.handleCustomerPhoneLookup(data);
                                }
                            }
                        } catch (e) {}
                    });

                    client.on('error', () => {
                        if (!this.cloudAvailable && brokerIndex + 1 < brokers.length) {
                            brokerIndex++;
                            try { client.end(true); } catch (e) {}
                            connectBroker(brokers[brokerIndex]);
                        }
                    });

                    client.on('offline', () => {
                        this.updateSyncStatusUI('🟡 در حال اتصال مجدد...');
                    });
                };

                connectBroker(brokers[brokerIndex]);

                window.addEventListener('beforeunload', () => {
                    if (this.mqttClient && this.mqttClient.connected) {
                        this.mqttClient.publish(presenceTopic, JSON.stringify({
                            sessionId: this.sessionId,
                            status: 'offline'
                        }));
                    }
                });
            },

            updateSyncStatusUI(statusText) {
                const el = document.getElementById('sync-connection-status');
                if (el) el.innerText = statusText;
                const roomBadge = document.getElementById('sync-room-code-display');
                if (roomBadge) roomBadge.innerText = this.roomCode;
            },

            applyIncomingData(data) {
                if (!data || data.updatedBy === this.sessionId) return;
                // Ignore stale packets older than what we already applied
                if (data.updatedAt && data.updatedAt < this.lastKnownStateTimestamp) return;
                if (data.updatedAt) this.lastKnownStateTimestamp = data.updatedAt;

                this.isApplyingRemote = true;
                try {
                    if (typeof window.applyRemoteState === 'function') {
                        window.applyRemoteState(data);
                    }
                } finally {
                    this.isApplyingRemote = false;
                }
            },

            async connectRoom(newRoomCode) {
                if (this.unsubPresence) { this.unsubPresence(); this.unsubPresence = null; }
                if (this.unsubState) { this.unsubState(); this.unsubState = null; }

                this.roomCode = (newRoomCode || 'macan-live-1').trim().toLowerCase();
                localStorage.setItem('macan_sync_room_code', this.roomCode);
                this.lastKnownStateTimestamp = 0;
                this.updateSyncStatusUI('🟡 در حال اتصال...');

                if (!this.user || !this.db) {
                    this.startWebSocketSync();
                    return;
                }

                const safeRoom = this.roomCode.replace(/[^a-z0-9_-]/g, '_');
                const presenceCol = collection(this.db, 'artifacts', this.appId, 'public', 'data', `online_${safeRoom}`);
                const presenceDoc = doc(this.db, 'artifacts', this.appId, 'public', 'data', `online_${safeRoom}`, this.sessionId);
                const stateDoc = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'gamenet_rooms', safeRoom);

                try {
                    const initialSnap = await getDoc(stateDoc);
                    if (initialSnap.exists()) {
                        this.applyIncomingData(initialSnap.data());
                    }
                } catch (e) {}

                const ping = async () => {
                    if (!this.user) return;
                    try {
                        await setDoc(presenceDoc, {
                            sessionId: this.sessionId,
                            lastSeen: Date.now()
                        });
                    } catch (e) {}
                };
                ping();
                if (this.pingTimer) clearInterval(this.pingTimer);
                this.pingTimer = setInterval(ping, 8000);

                window.addEventListener('beforeunload', () => {
                    deleteDoc(presenceDoc).catch(() => {});
                });

                this.unsubPresence = onSnapshot(presenceCol, (snapshot) => {
                    const now = Date.now();
                    let activeCount = 0;
                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d && d.lastSeen && (now - d.lastSeen) < 25000) {
                            activeCount++;
                        }
                    });
                    this.onlineCount = Math.max(1, activeCount);
                    if (typeof window.updateOnlineBadgeUI === 'function') {
                        window.updateOnlineBadgeUI(this.onlineCount);
                    }
                }, () => {});

                this.unsubState = onSnapshot(stateDoc, (docSnap) => {
                    if (!docSnap.exists()) return;
                    const data = docSnap.data();
                    if (!data || data.updatedBy === this.sessionId) return;
                    this.applyIncomingData(data);
                }, () => {});
            },

            sendBookingDecision(decisionPacket) {
                try {
                    localStorage.setItem('macan_booking_decision_broadcast', JSON.stringify(decisionPacket));
                } catch (e) {}
                if (this.mqttClient && this.mqttClient.connected) {
                    try {
                        const { bookingRespTopic } = this.getTopics();
                        this.mqttClient.publish(bookingRespTopic, JSON.stringify(decisionPacket), { qos: 1 });
                    } catch (e) {}
                }
            },

            async pushState(payload) {
                if (this.isApplyingRemote) return;
                const nowTs = Date.now();
                this.lastKnownStateTimestamp = nowTs;

                const packet = {
                    ...payload,
                    updatedBy: this.sessionId,
                    updatedAt: nowTs
                };

                // Broadcast locally across tabs/windows
                try {
                    if (this.channel) this.channel.postMessage(packet);
                    localStorage.setItem('macan_shared_broadcast_packet', JSON.stringify(packet));
                } catch (e) {}

                // Push to Firestore if inside host environment
                if (this.user && this.db) {
                    try {
                        const safeRoom = this.roomCode.replace(/[^a-z0-9_-]/g, '_');
                        const stateDoc = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'gamenet_rooms', safeRoom);
                        await setDoc(stateDoc, packet);
                        return;
                    } catch (e) {}
                }

                // Push via WebSocket MQTT Relay with Retain flag so refreshing phones get latest state immediately
                if (this.mqttClient && this.mqttClient.connected) {
                    try {
                        const { stateTopic, publicBoardTopic } = this.getTopics();
                        this.mqttClient.publish(stateTopic, JSON.stringify(packet), { qos: 1, retain: true });
                        if (typeof window.buildSanitizedPublicBoard === 'function') {
                            const pubData = window.buildSanitizedPublicBoard();
                            this.mqttClient.publish(publicBoardTopic, JSON.stringify(pubData), { qos: 1, retain: true });
                        }
                    } catch (e) {}
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            window.cloudSync.init();
        });
    </script>

            <div id="macan-lock-input-wrap">
                <input type="password" id="macan-lock-input" placeholder="رمز عبور ورود..." autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') checkMacanAdminLoginPass()">

                <span>مرا در این گوشی به خاطر بسپار</span>
            </label>
            <button type="button" id="macan-lock-btn" onclick="checkMacanAdminLoginPass()">ورود به پنل مدیریت</button>

    <script>
        (function () {
            const DEFAULT_LOGIN_PASS = 'makan1405';
            const PASS_STORAGE_KEY = 'macan_admin_login_password';
            const UNLOCK_TOKEN_KEY = 'macan_admin_unlocked_token_v1';

            function normLockDigits(s) {
                return String(s || '').trim()
                    .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
                    .replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
            }

            window.getMacanAdminLoginPass = function () {
                try {
                    return localStorage.getItem(PASS_STORAGE_KEY) || DEFAULT_LOGIN_PASS;
                } catch (e) {
                    return DEFAULT_LOGIN_PASS;
                }
            };

            window.setMacanAdminLoginPass = function (newPass, keepUnlocked = true) {
                const clean = String(newPass || '').trim();
                if (!clean) return;
                try {
                    localStorage.setItem(PASS_STORAGE_KEY, clean);
                    if (keepUnlocked) {
                        sessionStorage.setItem(UNLOCK_TOKEN_KEY, normLockDigits(clean));
                        if (localStorage.getItem(UNLOCK_TOKEN_KEY)) {
                            localStorage.setItem(UNLOCK_TOKEN_KEY, normLockDigits(clean));
                        }
                    }
                } catch (e) {}
            };

            window.verifyMacanAdminLockState = function () {
                const overlay = document.getElementById('macan-admin-lock');
                if (!overlay) return;
                const currentPass = normLockDigits(window.getMacanAdminLoginPass());
                let savedLocal = '';
                let savedSession = '';
                try {
                    savedLocal = localStorage.getItem(UNLOCK_TOKEN_KEY) || '';
                    savedSession = sessionStorage.getItem(UNLOCK_TOKEN_KEY) || '';
                } catch (e) {}

                if (savedLocal === currentPass || savedSession === currentPass) {
                    overlay.classList.add('unlocked');
                } else {
                    overlay.classList.remove('unlocked');
                    setTimeout(() => {
                        const inp = document.getElementById('macan-lock-input');
                        if (inp) inp.focus();
                    }, 80);
                }
            };

            window.toggleMacanLockInputVisibility = function () {
                const inp = document.getElementById('macan-lock-input');
                const eye = document.getElementById('macan-lock-eye');
                if (!inp) return;
                const isPass = inp.type === 'password';
                inp.type = isPass ? 'text' : 'password';
                if (eye) eye.textContent = isPass ? '🙈' : '👁️';
            };

            window.checkMacanAdminLoginPass = function () {
                const inp = document.getElementById('macan-lock-input');
                const err = document.getElementById('macan-lock-err');
                const rem = document.getElementById('macan-lock-remember');
                const overlay = document.getElementById('macan-admin-lock');
                const expected = normLockDigits(window.getMacanAdminLoginPass());
                const entered = normLockDigits(inp ? inp.value : '');

                if (entered && entered === expected) {
                    try {
                        sessionStorage.setItem(UNLOCK_TOKEN_KEY, expected);
                        if (rem && rem.checked) {
                            localStorage.setItem(UNLOCK_TOKEN_KEY, expected);
                        } else {
                            localStorage.removeItem(UNLOCK_TOKEN_KEY);
                        }
                    } catch (e) {}
                    if (overlay) overlay.classList.add('unlocked');
                    if (err) err.textContent = '';
                    if (inp) inp.value = '';
                } else {
                    if (err) err.textContent = 'رمز عبور اشتباه است! دوباره تلاش کنید.';
                    if (inp) {
                        inp.value = '';
                        inp.focus();
                    }
                }
            };

            window.lockAdminPanelNow = function () {
                try {
                    sessionStorage.removeItem(UNLOCK_TOKEN_KEY);
                    localStorage.removeItem(UNLOCK_TOKEN_KEY);
                } catch (e) {}
                if (typeof toggleNavDrawer === 'function') toggleNavDrawer(false);
                const overlay = document.getElementById('macan-admin-lock');
                const err = document.getElementById('macan-lock-err');
                const inp = document.getElementById('macan-lock-input');
                if (err) err.textContent = '';
                if (inp) {
                    inp.value = '';
                    inp.type = 'password';
                }
                if (overlay) overlay.classList.remove('unlocked');
                setTimeout(() => { if (inp) inp.focus(); }, 80);
            };

            window.verifyMacanAdminLockState();
        })();
    </script>

            // Merge consecutive dynamic slots (supports 30-min + 15-min seamless contiguous merging, 0 internal gap)

                    const slotMap = new Map(dynamicSlotsList.map(s => [s.startMin, s]));

            // Build complete unified booking record (supports both 'walkin' and 'online')

            buildUnifiedRecord({

            // Upgrade legacy reservations seamlessly to full unified format
            normalizeExistingRecord(rec) {

                const normKey = this.normalizeDateKey(rec.dateKey || rec.date);
                if (typeof rec.scheduledStartMin === 'number' && typeof rec.scheduledEndMin === 'number') {

                        actualStartMin: typeof rec.actualStartMin === 'number' ? rec.actualStartMin : rec.scheduledStartMin,
                        actualEndMin: typeof rec.actualEndMin === 'number' ? rec.actualEndMin : rec.scheduledEndMin,
                        actualStartStr: rec.actualStartStr || this.minToHHMM(typeof rec.actualStartMin === 'number' ? rec.actualStartMin : rec.scheduledStartMin),
                        actualEndStr: rec.actualEndStr || this.minToHHMM(typeof rec.actualEndMin === 'number' ? rec.actualEndMin : rec.scheduledEndMin),
                        scheduledStartStr: rec.scheduledStartStr || this.minToHHMM(rec.scheduledStartMin),
                        scheduledEndStr: rec.scheduledEndStr || this.minToHHMM(rec.scheduledEndMin),
                        actualDurationMin: typeof rec.actualDurationMin === 'number' ? rec.actualDurationMin : Math.max(15, rec.scheduledEndMin - rec.scheduledStartMin),
                        selectedSlots: Array.isArray(rec.selectedSlots) ? rec.selectedSlots : [],
                        status: rec.status || 'confirmed',
                        createdAt: rec.createdAt || 0
                    };
                }
                const parsedStart = this.parseTimeToMin(rec.timeStr || '17:00');
                const durMin = Math.round((rec.durationHours || 1) * 60);
                const startM = parsedStart >= 0 ? parsedStart : 1020;
                const endM = startM + Math.max(15, durMin);
                return this.buildUnifiedRecord({
                    id: rec.id,
                    devId: rec.devId,
                    devName: rec.devName,
                    devType: rec.devType,
                    dateKey: normKey,
                    dateLabel: rec.date,
                    customerName: rec.customerName,
                    phone: rec.phone,
                    bookingType: rec.bookingType || 'online',
                    actualStartMin: startM,
                    actualEndMin: endM,
                    actualDurationMin: Math.max(15, durMin),
                    selectedSlots: rec.selectedSlots,
                    status: rec.status || 'confirmed',
                    createdAt: rec.createdAt || 0,
                    trackingCode: rec.trackingCode || ''
                });
            },

            // Isolated 5-minute buffer rule:
            // - NEVER between consecutive internal slots of the same booking
            // - NEVER added to the end of a walk-in booking (16:13 -> 16:15 stays 16:15!)
            // - ONLY applied between two independent ONLINE bookings if rules.independentOnlineBufferEnabled === true
            getIndependentGapAfter(existingRec, candidateRec, rules) {
                if (!rules || !rules.independentOnlineBufferEnabled) return 0;
                if (!existingRec || !candidateRec) return 0;
                if (existingRec.id && candidateRec.id && existingRec.id === candidateRec.id) return 0;
                if (existingRec.bookingType === 'walkin') return 0;
                if (candidateRec.bookingType === 'walkin') return 0;
                return Math.max(0, Number(rules.independentBufferMin) || 5);
            },

            // Effective busy interval combining BOTH actual time and rounded scheduled time
            // Example: Walk-in 15:43-16:13 (rounded 15:45-16:15) -> [943, 975] (busy until 16:15, free from 16:15!)
            getEffectiveBounds(rec) {
                const aS = typeof rec.actualStartMin === 'number' ? rec.actualStartMin : rec.scheduledStartMin;
                const aE = typeof rec.actualEndMin === 'number' ? rec.actualEndMin : rec.scheduledEndMin;
                const sS = typeof rec.scheduledStartMin === 'number' ? rec.scheduledStartMin : this.ceilTo15Minutes(aS);
                const sE = typeof rec.scheduledEndMin === 'number' ? rec.scheduledEndMin : this.ceilTo15Minutes(aE);
                return {
                    effStart: Math.min(aS, sS),
                    effEnd: Math.max(aE, sE),
                    schedStart: sS,
                    schedEnd: sE
                };
            },

            // Build active walk-in busy interval from a live device state
            getActiveDeviceInterval(dev, todayDateKey, nowMin) {
                if (!dev || !dev.isActive) return null;
                let aStart = typeof dev.actualStartMin === 'number' && dev.actualStartMin >= 0 ? dev.actualStartMin : -1;
                if (aStart < 0 && dev.startTime) {
                    aStart = this.parseTimeToMin(dev.startTime);
                }
                if (aStart < 0) {
                    aStart = Math.max(0, nowMin - Math.floor((dev.elapsedSeconds || 0) / 60));
                }
                let aEnd;
                if (typeof dev.actualEndMin === 'number' && dev.actualEndMin > aStart) {
                    aEnd = dev.actualEndMin;
                } else if (dev.limitHours > 0) {
                    aEnd = aStart + Math.round(dev.limitHours * 60);
                } else {
                    // Open-ended active walk-in: occupies at least through current time rounded up (min 30 min ahead)
                    aEnd = Math.max(nowMin + 1, aStart + 30);
                }
                const sStart = typeof dev.scheduledStartMin === 'number' && dev.scheduledStartMin >= 0
                    ? dev.scheduledStartMin
                    : this.ceilTo15Minutes(aStart);
                const sEnd = typeof dev.scheduledEndMin === 'number' && dev.scheduledEndMin > sStart
                    ? dev.scheduledEndMin
                    : this.ceilTo15Minutes(aEnd);

                return {
                    id: dev.activeBookingId || ('live_' + dev.id),
                    devId: dev.id,
                    dateKey: todayDateKey,
                    bookingType: 'walkin',
                    actualStartMin: aStart,
                    actualEndMin: aEnd,
                    scheduledStartMin: sStart,
                    scheduledEndMin: sEnd,
                    scheduledStartStr: this.minToHHMM(sStart),
                    scheduledEndStr: this.minToHHMM(sEnd),
                    status: 'active',
                    customerName: dev.customerName || 'مشتری حضوری'
                };
            },

            // Central Conflict Checker (Per-device, integer minutes, 5 mandatory checks)
            checkConflict(candidate, context, options = {}) {
                const {
                    devices = [],
                    reservations = [],
                    pendingBookings = [],
                    dailyClosedWindows = [],
                    deviceClosures = [],
                    schedulingRules = { independentOnlineBufferEnabled: false, independentBufferMin: 5 },
                    isVenueDateOpenFn = null,
                    todayDateKey = '',
                    nowMin = 0
                } = context || {};

                const {
                    ignoreBookingId = null,
                    isAdminApproval = false,
                    ignorePending = false
                } = options || {};

                const devId = candidate.devId;
                const dateKey = this.normalizeDateKey(candidate.dateKey || candidate.date);
                const candBounds = this.getEffectiveBounds(candidate);
                const cStart = candBounds.effStart;
                const cEnd = candBounds.effEnd;

                if (!devId || !dateKey || cStart < 0 || cEnd <= cStart) {
                    return { conflict: true, reasonCode: 'INVALID_TIME', message: 'بازه زمانی انتخاب‌شده نامعتبر است.' };
                }

                // 1. Whole-venue closure check
                if (typeof isVenueDateOpenFn === 'function') {
                    const m = dateKey.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                    if (m && !isVenueDateOpenFn(parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10))) {
                        return { conflict: true, reasonCode: 'VENUE_CLOSED', message: 'بازی‌کده در این تاریخ تعطیل است.' };
                    }
                }

                // 1.5 Daily recurring closed time windows check (e.g., daily prayer break 17:15 - 17:45)
                for (const dw of (dailyClosedWindows || [])) {
                    if (!dw || dw.enabled === false) continue;
                    if (dw.devId && dw.devId !== 'ALL' && dw.devId !== devId) continue;
                    const dwStart = typeof dw.startMin === 'number' ? dw.startMin : -1;
                    const dwEnd = typeof dw.endMin === 'number' ? dw.endMin : -1;
                    if (dwStart >= 0 && dwEnd > dwStart && cStart < dwEnd && cEnd > dwStart) {
                        return {
                            conflict: true,
                            reasonCode: 'DAILY_CLOSED_WINDOW',
                            conflictingClosure: dw,
                            message: `تعطیلی روزانه (${dw.label || 'ساعت تعطیل'}): ${this.minToHHMM(dwStart)} تا ${this.minToHHMM(dwEnd)} امکان رزرو وجود ندارد.`
                        };
                    }
                }

                // 2. Device-specific or all-devices closure check
                for (const cls of (deviceClosures || [])) {
                    if (!cls) continue;
                    const clsDateKey = this.normalizeDateKey(cls.dateKey || cls.date);
                    if (clsDateKey !== dateKey) continue;
                    if (cls.devId !== 'ALL' && cls.devId !== devId) continue;
                    const clsStart = typeof cls.startMin === 'number' ? cls.startMin : 0;
                    const clsEnd = typeof cls.endMin === 'number' ? cls.endMin : 1440;
                    if (cStart < clsEnd && cEnd > clsStart) {
                        return {
                            conflict: true,
                            reasonCode: 'DEVICE_CLOSED',
                            conflictingClosure: cls,
                            message: `این دستگاه در بازه ${this.minToHHMM(clsStart)} تا ${this.minToHHMM(clsEnd)} غیرفعال/تعطیل است${cls.reason ? ` (${cls.reason})` : ''}.`
                        };
                    }
                }

                // 3. Active live walk-in session check (on today's date)
                if (dateKey === todayDateKey) {
                    const liveDev = devices.find(d => d.id === devId && d.isActive);
                    if (liveDev && liveDev.activeBookingId !== ignoreBookingId) {
                        const liveInterval = this.getActiveDeviceInterval(liveDev, todayDateKey, nowMin);
                        if (liveInterval) {
                            const lBounds = this.getEffectiveBounds(liveInterval);
                            // Walk-in end NEVER gets +5 min added! Busy strictly until lBounds.effEnd (e.g. 16:15)
                            if (cStart < lBounds.effEnd && cEnd > lBounds.effStart) {
                                return {
                                    conflict: true,
                                    reasonCode: 'ACTIVE_WALKIN',
                                    conflictingBooking: liveInterval,
                                    message: `دستگاه در حال بازی حضوری است و تا ساعت ${this.minToHHMM(lBounds.schedEnd)} اشغال می‌باشد.`
                                };
                            }
                        }
                    }
                }

                // 4. Confirmed / active / recently-completed-until-rounded-end reservations check
                for (const rawRes of (reservations || [])) {
                    const r = this.normalizeExistingRecord(rawRes);
                    if (!r || r.devId !== devId || r.dateKey !== dateKey) continue;
                    if (ignoreBookingId && r.id === ignoreBookingId) continue;
                    if (r.status === 'cancelled' || r.status === 'rejected') continue;
                    // Completed walk-in only blocks until its rounded scheduled end (e.g. finished 16:13 -> blocks until 16:15)
                    if (r.status === 'completed') {
                        if (dateKey !== todayDateKey || nowMin >= r.scheduledEndMin) continue;
                    }
                    const rBounds = this.getEffectiveBounds(r);
                    const gapAfterExisting = this.getIndependentGapAfter(r, candidate, schedulingRules);
                    const gapAfterCandidate = this.getIndependentGapAfter(candidate, r, schedulingRules);

                    if (cStart < (rBounds.effEnd + gapAfterExisting) && (cEnd + gapAfterCandidate) > rBounds.effStart) {
                        const typeLbl = r.bookingType === 'walkin' ? 'حضوری' : 'اینترنتی';
                        return {
                            conflict: true,
                            reasonCode: 'CONFIRMED_OVERLAP',
                            conflictingBooking: r,
                            message: `تداخل با رزرو ${typeLbl} ثبت‌شده (${this.minToHHMM(rBounds.schedStart)} تا ${this.minToHHMM(rBounds.schedEnd)}).`
                        };
                    }
                }

                // 5. Pending approval requests & FIFO time-priority check
                if (!ignorePending) {
                    const sortedPending = (pendingBookings || [])
                        .map(p => this.normalizeExistingRecord({ ...p, status: p.status || 'pending' }))
                        .filter(p => p && p.devId === devId && p.dateKey === dateKey && p.status === 'pending' && (!ignoreBookingId || p.id !== ignoreBookingId))
                        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

                    for (const p of sortedPending) {
                        const pBounds = this.getEffectiveBounds(p);
                        const gapAfterP = this.getIndependentGapAfter(p, candidate, schedulingRules);
                        const gapAfterC = this.getIndependentGapAfter(candidate, p, schedulingRules);

                        if (cStart < (pBounds.effEnd + gapAfterP) && (cEnd + gapAfterC) > pBounds.effStart) {
                            if (isAdminApproval) {
                                // Enforce FIFO priority: cannot approve a newer overlapping request while an older one is still pending
                                const candTs = candidate.createdAt || Date.now();
                                if ((p.createdAt || 0) < candTs) {
                                    return {
                                        conflict: true,
                                        reasonCode: 'EARLIER_PENDING_PRIORITY',
                                        conflictingBooking: p,
                                        message: `درخواست قدیمی‌تری (${p.customerName || 'مشتری'} - ${this.minToHHMM(pBounds.schedStart)} تا ${this.minToHHMM(pBounds.schedEnd)}) با اولویت زمانی بالاتر در انتظار بررسی است. ابتدا آن را تعیین تکلیف کنید.`
                                    };
                                }
                            } else {
                                return {
                                    conflict: true,
                                    reasonCode: 'PENDING_OVERLAP',
                                    conflictingBooking: p,
                                    message: `بازه ${this.minToHHMM(pBounds.schedStart)} تا ${this.minToHHMM(pBounds.schedEnd)} در انتظار تأیید درخواست دیگری است.`
                                };
                            }
                        }
                    }
                }

                return { conflict: false, reasonCode: 'OK', message: '' };
            },

            // Determine 30-min slot status for Customer UI: 'green' | 'orange' | 'red'
            getSlotStatus(devId, dateKey, slotStartMin, slotEndMin, context) {
                const candidate = {
                    devId,
                    dateKey,
                    bookingType: 'online',
                    actualStartMin: slotStartMin,
                    actualEndMin: slotEndMin,
                    scheduledStartMin: slotStartMin,
                    scheduledEndMin: slotEndMin
                };

                // First check hard blocks (closures, active walk-ins, confirmed bookings) -> RED
                const hardCheck = this.checkConflict(candidate, context, { ignorePending: true });
                if (hardCheck.conflict) {
                    return {
                        color: 'red',
                        status: 'blocked',
                        reasonCode: hardCheck.reasonCode,
                        message: hardCheck.message
                    };
                }

                // Next check pending approval requests -> ORANGE
                const pendingCheck = this.checkConflict(candidate, context, { ignorePending: false });
                if (pendingCheck.conflict && pendingCheck.reasonCode === 'PENDING_OVERLAP') {
                    return {
                        color: 'orange',
                        status: 'pending',
                        reasonCode: 'PENDING_OVERLAP',
                        message: pendingCheck.message
                    };
                }

                return {
                    color: 'green',
                    status: 'free',
                    reasonCode: 'OK',
                    message: 'آزاد'
                };
            }
        };

        function getTodayDateKey() {
            const p = getShamsiParts();
            return makeDateKey(p.year, p.month, p.day);
        }

        function getNowMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        // =========================================================================
        // High-Contrast Digital Time Picker (Replaces native browser clock dialog)
        // =========================================================================
        function renderDigitalTimePicker(baseId, initialHHMM = '17:00', opts = {}) {
            const { showNow = false, onChange = '' } = opts || {};
            const norm = MacanScheduler.normalizeDigits(initialHHMM || '17:00');
            const parts = norm.includes(':') ? norm.split(':') : ['17', '00'];
            const hNum = Math.min(23, Math.max(0, parseInt(parts[0], 10) || 0));
            const mNum = Math.min(59, Math.max(0, parseInt(parts[1], 10) || 0));
            const hPad = String(hNum).padStart(2, '0');
            const mPad = String(mNum).padStart(2, '0');
            const cleanVal = `${hPad}:${mPad}`;
            const safeCb = onChange ? onChange.replace(/"/g, '&quot;') : '';

            let hourOpts = '';
            for (let h = 0; h < 24; h++) {
                const hp = String(h).padStart(2, '0');
                hourOpts += `<option value="${hp}" ${h === hNum ? 'selected' : ''}>${hp}</option>`;
            }

            const minChips = ['00', '15', '30', '45'].map(mp => `
                <button type="button" onclick="setDigitalTimeMinute('${baseId}', '${mp}')"
                    class="flex-1 py-1 rounded-lg bg-slate-900 hover:bg-amber-500/20 border border-slate-800 hover:border-amber-400/60 text-slate-300 hover:text-amber-300 font-mono font-bold text-[11px] transition cursor-pointer">
                    :${mp}
                </button>
            `).join('');

            return `
                <div class="bg-slate-950 border border-cyan-500/35 rounded-2xl p-2 space-y-1.5" data-cb="${safeCb}">
                    <input type="hidden" id="${baseId}" value="${cleanVal}">
                    <div class="flex items-center justify-center gap-1.5" dir="ltr">
                        <div class="w-[74px]">
                            <select id="${baseId}-h" aria-label="ساعت" onchange="syncDigitalTimePicker('${baseId}')"
                                class="w-full bg-slate-900 border border-amber-500/45 rounded-xl px-2 py-1.5 text-amber-300 font-mono font-black text-base text-center">
                                ${hourOpts}
                            </select>
                        </div>
                        <span class="text-cyan-400 font-black text-lg select-none">:</span>
                        <input type="text" id="${baseId}-m" inputmode="numeric" maxlength="2" value="${mPad}" aria-label="دقیقه"
                            onfocus="this.select()"
                            oninput="syncDigitalTimePicker('${baseId}', false)"
                            onblur="syncDigitalTimePicker('${baseId}', true)"
                            class="w-14 bg-slate-900 border border-cyan-500/45 rounded-xl py-1.5 text-cyan-300 font-mono font-black text-base text-center">
                        ${showNow ? `
                            <button type="button" onclick="setDigitalTimeNow('${baseId}')" dir="rtl"
                                class="px-2.5 py-1.5 rounded-xl bg-cyan-600/25 hover:bg-cyan-600 border border-cyan-500/45 text-cyan-200 hover:text-white font-extrabold text-[11px] transition cursor-pointer">
                                الان
                            </button>
                        ` : ''}
                    </div>
                    <div class="flex items-center gap-1" dir="ltr">
                        ${minChips}
                    </div>
                </div>
            `;
        }

        function syncDigitalTimePicker(baseId, padMinute = true) {
            const hiddenEl = document.getElementById(baseId);
            const hEl = document.getElementById(`${baseId}-h`);
            const mEl = document.getElementById(`${baseId}-m`);
            if (!hiddenEl || !hEl || !mEl) return;

            const hVal = String(Math.min(23, Math.max(0, parseInt(MacanScheduler.normalizeDigits(hEl.value), 10) || 0))).padStart(2, '0');
            const rawDigits = MacanScheduler.normalizeDigits(mEl.value).replace(/\D/g, '');
            let mNum = parseInt(rawDigits, 10);
            if (isNaN(mNum)) mNum = 0;
            if (mNum > 59) mNum = 59;
            const mPad = String(mNum).padStart(2, '0');

            if (padMinute) {
                mEl.value = mPad;
            } else if (rawDigits !== mEl.value) {
                mEl.value = rawDigits;
            }

            hiddenEl.value = `${hVal}:${mPad}`;
            const wrapper = hiddenEl.closest('[data-cb]');
            const cbCode = wrapper ? wrapper.getAttribute('data-cb') : '';
            if (cbCode) {
                try { new Function(cbCode)(); } catch (e) {}
            }
        }

        function setDigitalTimeMinute(baseId, minStr) {
            const mEl = document.getElementById(`${baseId}-m`);
            if (!mEl) return;
            mEl.value = minStr;
            syncDigitalTimePicker(baseId, true);
        }

        function setDigitalTimeNow(baseId) {
            const now = new Date();
            const hEl = document.getElementById(`${baseId}-h`);
            const mEl = document.getElementById(`${baseId}-m`);
            if (hEl) {
                hEl.value = String(now.getHours()).padStart(2, '0');
                hEl.dispatchEvent(new Event('change', { bubbles: true }));
            }
            if (mEl) {
                mEl.value = String(now.getMinutes()).padStart(2, '0');
            }
            syncDigitalTimePicker(baseId, true);
        }

        function getSchedulerContext() {
            return {
                devices,
                reservations,
                pendingBookings: pendingCustomerBookings,
                dailyClosedWindows,
                deviceClosures,
                schedulingRules,
                isVenueDateOpenFn: isShamsiDateOpen,
                todayDateKey: getTodayDateKey(),
                nowMin: getNowMinutes()
            };
        }

        function normalizeDigits(str) {
            if (!str) return '';
            const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            const arabicDigits  = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            let res = String(str).trim();
            for (let i = 0; i < 10; i++) {
                res = res.replace(new RegExp(persianDigits[i], 'g'), String(i))
                         .replace(new RegExp(arabicDigits[i], 'g'), String(i));
            }
            return res;
        }

        function getShamsiParts(dateObj = new Date()) {
            const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', {
                year: 'numeric',
                month: 'numeric',
                day: 'numeric'
            }).formatToParts(dateObj);
            const map = {};
            parts.forEach(p => { map[p.type] = p.value; });
            return {
                year: parseInt(map.year, 10) || 1405,
                month: parseInt(map.month, 10) || 1,
                day: parseInt(map.day, 10) || 1
            };
        }

        function getShamsiDateString(dateObj = new Date()) {
            const p = getShamsiParts(dateObj);
            const mName = persianMonths[p.month - 1] || p.month;
            return `${p.day} ${mName} ${p.year}`;
        }

        function getShamsiFullDisplay(dateObj = new Date()) {
            const weekday = dateObj.toLocaleDateString('fa-IR', { weekday: 'long' });
            const p = getShamsiParts(dateObj);
            const mName = persianMonths[p.month - 1] || p.month;
            return `${weekday}، ${p.day} ${mName} ${p.year}`;
        }

        function getPersianDayName(dateObj = new Date()) {
            return dateObj.toLocaleDateString('fa-IR', { weekday: 'long' });
        }

        function formatMoney(amount) {
            const exactVal = Math.round(amount || 0);
            return exactVal.toLocaleString('en-US') + ' تومان';
        }

        function formatTime(seconds) {
            const total = Math.max(0, Math.floor(seconds || 0));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = Math.floor(total % 60);
            const pad = num => String(num).padStart(2, '0');
            return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        }

        function numberToPersianWords(num) {
            if (isNaN(num) || num <= 0) return 'صفر تومان';
            const ones = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
            const teens = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
            const tens = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
            const hundreds = ['', 'صد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];

            function convertGroup(n) {
                let res = [];
                let h = Math.floor(n / 100);
                let rem = n % 100;
                if (h > 0) res.push(hundreds[h]);
                if (rem >= 10 && rem < 20) {
                    res.push(teens[rem - 10]);
                } else {
                    let t = Math.floor(rem / 10);
                    let o = rem % 10;
                    if (t > 0) res.push(tens[t]);
                    if (o > 0) res.push(ones[o]);
                }
                return res.join(' و ');
            }

            let thousands = Math.floor(num / 1000);
            let remainder = num % 1000;
            let resultParts = [];

            if (thousands > 0) resultParts.push(convertGroup(thousands) + ' هزار');
            if (remainder > 0) resultParts.push(convertGroup(remainder));

            return resultParts.join(' و ') + ' تومان';
        }

        function roundToThousand(amount) {
            if (!amount || amount <= 0) return 0;
            return Math.round(amount / 1000) * 1000;
        }

        function calculateCost(dev) {
            if (!dev.isActive || dev.elapsedSeconds <= 0) return 0;
            const hours = dev.elapsedSeconds / 3600;
            let rawCost = 0;
            if (dev.type === 'ps4') {
                const controllers = dev.controllers || 1;
                rawCost = hours * (rates.ps4[controllers] || rates.ps4[1]);
            } else if (dev.type === 'foosball') {
                rawCost = (dev.elapsedSeconds / 900) * rates.foosball15Min;
            } else if (dev.type === 'airhockey') {
                rawCost = (dev.elapsedSeconds / 900) * rates.airhockey15Min;
            } else if (dev.type === 'boardgame') {
                rawCost = hours * rates.boardgamePersonHour * (dev.controllers || 1);
            }
            return roundToThousand(rawCost);

        function applyRemoteState(data) {
            if (Array.isArray(data.devices)) {
                data.devices.forEach(remoteDev => {
                    const localDev = devices.find(d => d.id === remoteDev.id);
                    if (localDev) Object.assign(localDev, remoteDev);
                });
            }
            if (Array.isArray(data.completedLogs)) completedLogs = data.completedLogs;
            if (Array.isArray(data.reservations)) reservations = data.reservations;
            if (data.rates) rates = data.rates;
            if (Array.isArray(data.buffetCatalog)) buffetCatalog = data.buffetCatalog;
            if (data.customerDatabase) customerDatabase = data.customerDatabase;
            if (Array.isArray(data.durationPresets)) durationPresets = data.durationPresets;
            if (typeof data.quickNoteText === 'string') {
                quickNoteText = data.quickNoteText;
                const noteInput = document.getElementById('manager-quick-note');
                if (noteInput && document.activeElement !== noteInput) {
                    noteInput.value = quickNoteText;
                }
            }
            if (data.azanTimeSetting) {
                azanTimeSetting = data.azanTimeSetting;
                const textEl = document.getElementById('azan-time-text');
                if (textEl) textEl.innerText = azanTimeSetting;
            }
            if (Array.isArray(data.openWeekdays)) openWeekdays = data.openWeekdays;
            if (data.dateOverrides && typeof data.dateOverrides === 'object') dateOverrides = data.dateOverrides;
            if (Array.isArray(data.dailyClosedWindows)) dailyClosedWindows = data.dailyClosedWindows;
            if (Array.isArray(data.deviceClosures)) deviceClosures = data.deviceClosures;
            if (data.operatingHours && typeof data.operatingHours === 'object') operatingHours = data.operatingHours;
            if (data.schedulingRules && typeof data.schedulingRules === 'object') schedulingRules = data.schedulingRules;
            if (Array.isArray(data.pendingCustomerBookings)) {
                pendingCustomerBookings = data.pendingCustomerBookings;
                if (typeof renderIncomingBookingsBanner === 'function') renderIncomingBookingsBanner();
                if (typeof renderUnifiedTopStrip === 'function') renderUnifiedTopStrip();
            }
            if (typeof data.adminLoginPassword === 'string' && data.adminLoginPassword.trim()) {
                const incomingPass = data.adminLoginPassword.trim();
                if (incomingPass !== adminLoginPassword) {
                    adminLoginPassword = incomingPass;
                    if (typeof window.setMacanAdminLoginPass === 'function') {
                        window.setMacanAdminLoginPass(adminLoginPassword, false);
                    } else {
                        try { localStorage.setItem('macan_admin_login_password', adminLoginPassword); } catch (e) {}
                    }
                    if (typeof window.verifyMacanAdminLockState === 'function') {
                        window.verifyMacanAdminLockState();
                    }
                }
            }
            // Persist incoming state locally so a subsequent page reload on this phone also keeps the synced state
            try {
                localStorage.setItem('macan_devices_state', JSON.stringify(devices));
                localStorage.setItem('macan_completed_logs', JSON.stringify(completedLogs));
                localStorage.setItem('macan_reservations', JSON.stringify(reservations));
                localStorage.setItem('macan_rates', JSON.stringify(rates));
                localStorage.setItem('macan_buffet_catalog', JSON.stringify(buffetCatalog));
                localStorage.setItem('macan_customers_db', JSON.stringify(customerDatabase));
            } catch (e) {}

            renderAllDevices();
        }

        function updateWalkInStartPreview() {
            const dev = devices.find(d => d.id === activeStartDevId);
            if (!dev) return;

            const timeEl = document.getElementById('start-actual-time');
            const limitSel = document.getElementById('start-limit-hours');
            const customMinEl = document.getElementById('start-custom-minutes');
            const alertEl = document.getElementById('start-conflict-alert');
            const btnEl = document.getElementById('confirm-start-game-btn');

            const startMin = MacanScheduler.parseTimeToMin(timeEl ? timeEl.value : '');
            const actualStart = startMin >= 0 ? startMin : getNowMinutes();

            let durMin = 0;
            const customVal = customMinEl ? parseInt(normalizeDigits(customMinEl.value), 10) : 0;
            if (customVal > 0) {
                durMin = customVal;
            } else {
                const limHrs = limitSel ? (parseFloat(limitSel.value) || 0) : 0;
                durMin = limHrs > 0 ? Math.round(limHrs * 60) : 0;
            }

            const effectiveDur = durMin > 0 ? durMin : 30;
            const actualEnd = actualStart + effectiveDur;
            const schedStart = MacanScheduler.ceilTo15Minutes(actualStart);
            const schedEnd = MacanScheduler.ceilTo15Minutes(actualEnd);



            const candidate = {
                devId: dev.id,
                dateKey: getTodayDateKey(),
                bookingType: 'walkin',
                actualStartMin: actualStart,
                actualEndMin: actualEnd,
                scheduledStartMin: schedStart,
                scheduledEndMin: schedEnd
            };

            const conflictRes = MacanScheduler.checkConflict(candidate, getSchedulerContext(), { ignoreBookingId: dev.pendingReservationId || null });
            if (conflictRes.conflict) {
                if (alertEl) {
                    alertEl.textContent = '⚠️ ' + conflictRes.message;
                    alertEl.classList.remove('hidden');
                }
                if (btnEl) {
                    btnEl.disabled = true;
                    btnEl.classList.add('opacity-50', 'cursor-not-allowed');
                }
            } else {
                if (alertEl) alertEl.classList.add('hidden');
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }
        }

        function confirmStartGame() {
            const dev = devices.find(d => d.id === activeStartDevId);
            if (!dev) return;

            const nameInputs = document.querySelectorAll('.player-name-input');
            const phoneInputs = document.querySelectorAll('.player-phone-input');
            const playerNames = [];
            const playerPhones = [];

            nameInputs.forEach((input, idx) => {
                const nVal = input.value.trim();
                const pVal = phoneInputs[idx] ? phoneInputs[idx].value.trim() : '';
                if (nVal) {
                    playerNames.push(nVal);
                    playerPhones.push(pVal);
                    registerCustomerToDB(nVal, pVal);
                }
            });

            if (playerNames.length === 0) {
                showToastNotification('خطا: لطفاً نام حداقل یک بازیکن را وارد کنید.');
                return;
            }

            const limitSelect = document.getElementById('start-limit-hours');
            const customMinEl = document.getElementById('start-custom-minutes');
            const actualTimeEl = document.getElementById('start-actual-time');
            const boardTitleInput = document.getElementById('start-boardgame-title');

            if (dev.type === 'boardgame' && boardTitleInput && !boardTitleInput.value.trim()) {
                showToastNotification('خطا: لطفاً نام بازی فکری را وارد کنید.');
                return;
            }

            const parsedStartMin = MacanScheduler.parseTimeToMin(actualTimeEl ? actualTimeEl.value : '');
            const actualStartMin = parsedStartMin >= 0 ? parsedStartMin : getNowMinutes();

            const customVal = customMinEl ? parseInt(normalizeDigits(customMinEl.value), 10) : 0;
            let limitHours = limitSelect ? parseFloat(limitSelect.value) : 0;
            if (customVal > 0) {
                limitHours = customVal / 60;
            }

            const actualDurMin = limitHours > 0 ? Math.round(limitHours * 60) : 30;
            const actualEndMin = actualStartMin + actualDurMin;

            const walkInRec = MacanScheduler.buildUnifiedRecord({
                devId: dev.id,
                devName: dev.name,
                devType: dev.type,
                dateKey: getTodayDateKey(),
                customerName: playerNames.join('، '),
                phone: playerPhones.find(p => p) || '',
                bookingType: 'walkin',
                actualStartMin: actualStartMin,
                actualEndMin: actualEndMin,
                actualDurationMin: actualDurMin,
                status: 'active',
                openMin: operatingHours.openMin,
                closeMin: operatingHours.closeMin
            });

            // Central conflict check before starting walk-in session!
            const conflictCheck = MacanScheduler.checkConflict(walkInRec, getSchedulerContext(), { ignoreBookingId: dev.pendingReservationId || null });
            if (conflictCheck.conflict) {
                showToastNotification('⛔ ' + conflictCheck.message);
                updateWalkInStartPreview();
                return;
            }

            dev.gameName = boardTitleInput ? (boardTitleInput.value.trim() || 'بازی فکری') : '';
            dev.playerNames = playerNames;
            dev.playerPhones = playerPhones;
            dev.customerName = dev.playerNames.join('، ');
            dev.customerPhone = playerPhones.find(p => p) || '';
            dev.limitHours = limitHours;

            if (dev.type === 'ps4') {
                const ctrlSelect = document.getElementById('start-controllers');
                if (ctrlSelect) dev.controllers = parseInt(ctrlSelect.value, 10) || 1;
            } else if (dev.type === 'boardgame') {
                const cntInput = document.getElementById('start-players-count');
                if (cntInput) dev.controllers = parseInt(cntInput.value, 10) || 1;
            }

            dev.startTime = walkInRec.actualStartStr;
            dev.endTime = limitHours > 0 ? walkInRec.actualEndStr : 'آزاد';
            dev.actualStartMin = walkInRec.actualStartMin;
            dev.actualEndMin = limitHours > 0 ? walkInRec.actualEndMin : 0;
            dev.scheduledStartMin = walkInRec.scheduledStartMin;
            dev.scheduledEndMin = walkInRec.scheduledEndMin;
            dev.activeBookingId = walkInRec.id;
            delete dev.pendingReservationId;

            dev.isActive = true;
            dev.isPaused = false;
            dev.elapsedSeconds = 0;
            dev.startTimestamp = Date.now();
            dev.pausedAccumulatedSeconds = 0;
            dev.timeUp = false;
            dev.buffetItems = [];

            // Store unified walk-in record in central reservations list
            reservations.push(walkInRec);

            manualSaveAllData(true);
            closeStartModal();
            renderAllDevices();
            showToastNotification(`▶️ سانس حضوری ثبت شد (واقعی: ${walkInRec.actualStartStr} تا ${walkInRec.actualEndStr} | تقویم: ${walkInRec.scheduledStartStr} تا ${walkInRec.scheduledEndStr})`);
        }

        function updateSettlementModalUI() {
            const dev = devices.find(d => d.id === activeSettlementDevId);
            if (!dev) return;

            let modal = document.getElementById('settlement-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'settlement-modal';
                modal.className = 'fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden';
                document.body.appendChild(modal);

            const gameCost = calculateCost(dev);
            const buffetCost = roundToThousand((dev.buffetItems || []).reduce((acc, item) => acc + (item.price || 0), 0));
            const grossTotal = roundToThousand(gameCost + buffetCost);
            const discountAmount = roundToThousand((grossTotal * currentDiscountPercent) / 100);
            const totalCost = roundToThousand(Math.max(0, grossTotal - discountAmount));

            const count = (dev.playerNames && dev.playerNames.length > 0) ? dev.playerNames.length : (dev.controllers || 1);
            const perPerson = roundToThousand(totalCost / count);

            // محاسبه کل هزینه سانس کامل (اگر زمان مشخص داشته، مثل 1 ساعت)
            let fullSessionGameCost = gameCost;
            if (dev.limitHours > 0) {
                if (dev.type === 'ps4') fullSessionGameCost = roundToThousand((rates.ps4[dev.controllers || 1] || rates.ps4[1]) * dev.limitHours);
                else if (dev.type === 'boardgame') fullSessionGameCost = roundToThousand(rates.boardgamePersonHour * (dev.controllers || 1) * dev.limitHours);
                else if (dev.type === 'foosball') fullSessionGameCost = roundToThousand(rates.foosball15Min * (dev.limitHours * 4));
                else if (dev.type === 'airhockey') fullSessionGameCost = roundToThousand(rates.airhockey15Min * (dev.limitHours * 4));
            }
            const fullSessionTotalWithBuffet = roundToThousand(Math.max(0, (fullSessionGameCost + buffetCost) - Math.round(((fullSessionGameCost + buffetCost) * currentDiscountPercent) / 100)));

            const remainingSecs = dev.limitHours > 0 ? Math.max(0, Math.round((dev.limitHours * 3600) - dev.elapsedSeconds)) : 0;

            // بررسی سابقه بدهی یا طلب قبلی بازیکنان این سانس
            const sessionPlayers = (Array.isArray(dev.playerNames) && dev.playerNames.length > 0) ? dev.playerNames : [dev.customerName || ''];
            let previousBalanceTotal = 0;
            sessionPlayers.forEach(pName => {
                const normP = normalizePersianText(pName);
                if (!normP) return;
                const matched = Object.values(customerDatabase).find(c => c && normalizePersianText(c.name) === normP);
                if (matched && typeof matched.moneyBalance === 'number') {
                    previousBalanceTotal += matched.moneyBalance;
                }

            modal.innerHTML = `

                            <span class="font-bold text-white">${dev.customerName}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">هزینه زمان بازی‌شده (${formatTime(dev.elapsedSeconds)}):</span>
                            <div class="text-left">
                                <span class="font-mono text-cyan-300 font-bold block">${formatMoney(gameCost)}</span>

                        </div>
                        <div class="flex justify-between">

                                <span class="text-[9px] text-amber-300">${numberToPersianWords(buffetCost)}</span>

                            <span class="text-[10px] text-purple-300 block font-bold">اعمال تخفیف / بن وفاداری:</span>
                            <div class="grid grid-cols-4 gap-1.5">

                                <button onclick="setDiscount(10)" class="py-1 px-2 rounded-lg font-bold text-[10px] ${currentDiscountPercent === 10 ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}">۱۰٪</button>
                                <button onclick="setDiscount(20)" class="py-1 px-2 rounded-lg font-bold text-[10px] ${currentDiscountPercent === 20 ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400'}">۲۰٪</button>
