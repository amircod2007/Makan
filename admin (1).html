        function saveRemainingTimeAsCredit(paidFullSession = true) {
            const dev = devices.find(d => d.id === activeSettlementDevId);
            if (!dev) return;

            const remainingSecs = dev.limitHours > 0 ? Math.max(0, Math.round((dev.limitHours * 3600) - dev.elapsedSeconds)) : 1800;
            const now = new Date();
            const dayName = getPersianDayName(now);
            const shamsiDate = getShamsiDateString(now);

            if (paidFullSession) {
                let fullGameCost = calculateCost(dev);
                if (dev.limitHours > 0) {
                    if (dev.type === 'ps4') fullGameCost = roundToThousand((rates.ps4[dev.controllers || 1] || rates.ps4[1]) * dev.limitHours);
                    else if (dev.type === 'boardgame') fullGameCost = roundToThousand(rates.boardgamePersonHour * (dev.controllers || 1) * dev.limitHours);
                    else if (dev.type === 'foosball') fullGameCost = roundToThousand(rates.foosball15Min * (dev.limitHours * 4));
                    else if (dev.type === 'airhockey') fullGameCost = roundToThousand(rates.airhockey15Min * (dev.limitHours * 4));
                }
                const buffetCost = roundToThousand((dev.buffetItems || []).reduce((acc, item) => acc + (item.price || 0), 0));
                const grossTotal = roundToThousand(fullGameCost + buffetCost);
                const discountAmount = roundToThousand((grossTotal * currentDiscountPercent) / 100);
                const finalPaid = roundToThousand(Math.max(0, grossTotal - discountAmount));

                completedLogs.push({
                    id: Date.now(),
                    devId: dev.id,
                    devName: `${dev.name} (سانس کامل + ذخیره زمان)`,
                    devType: dev.type,
                    customerName: dev.customerName || 'مشتری',
                    customerPhone: dev.customerPhone || 'بدون شماره',
                    playerCount: (dev.playerNames && dev.playerNames.length > 0) ? dev.playerNames.length : (dev.controllers || 1),
                    duration: `${formatTime(dev.elapsedSeconds)} بازی + ${formatTime(remainingSecs)} ذخیره`,
                    buffetCount: (dev.buffetItems || []).length,
                    buffetTotal: buffetCost,
                    totalCost: finalPaid,
                    paymentMethod: 'card',
                    dayName: dayName,
                    shamsiDate: shamsiDate,
                    timeStr: now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }),
                    timestamp: now.getTime()
                });
            }

            const names = (dev.playerNames && dev.playerNames.length > 0) ? dev.playerNames : [dev.customerName || 'مشتری'];
            const phones = dev.playerPhones || [];

            names.forEach((pName, idx) => {
                const cleanName = (pName || '').trim();
                if (!cleanName || cleanName === 'مشتری آزاد') return;
                const cleanPhone = (phones[idx] || (idx === 0 ? dev.customerPhone : '') || '').trim();
                const cust = ensureCustomerExists(cleanName, cleanPhone);
                if (!cust) return;

                const timeRecord = {
                    id: 'time_' + Date.now() + '_' + idx,
                    recordType: 'credit',
                    devId: dev.id,
                    devName: dev.name,
                    devType: dev.type,
                    gameName: dev.gameName || '',
                    customerName: cleanName,
                    controllers: dev.controllers || 1,
                    remainingSeconds: remainingSecs,
                    note: paidFullSession ? 'باقی‌مانده سانس تسویه‌شده' : 'زمان رزرو شده',
                    dayName: dayName,
                    shamsiDate: shamsiDate
                };

                cust.debts.push(timeRecord);
            });

            resetDeviceAfterSession(dev);
            manualSaveAllData(true);
            closeSettlementModal();
            renderAllDevices();
            showToastNotification(`⏳ ${formatTime(remainingSecs)} طلب زمان در پرونده مشتری ذخیره شد.`);
        }

        function finalizeActiveWalkInRecord(dev) {
            if (!dev || !dev.activeBookingId) return;
            const rec = reservations.find(r => r.id === dev.activeBookingId);
            if (!rec) return;
            const nowMin = getNowMinutes();
            const actualStart = typeof rec.actualStartMin === 'number' ? rec.actualStartMin : Math.max(0, nowMin - Math.max(1, Math.round((dev.elapsedSeconds || 60) / 60)));
            const actualEnd = Math.max(actualStart + 1, nowMin);
            const roundedEnd = MacanScheduler.ceilTo15Minutes(actualEnd); // Strictly ceil to 15 min; NO +5 min!
            rec.actualEndMin = actualEnd;
            rec.actualEndStr = MacanScheduler.minToHHMM(actualEnd);
            rec.actualDurationMin = Math.max(1, Math.round((dev.elapsedSeconds || 60) / 60));
            rec.scheduledEndMin = roundedEnd;
            rec.scheduledEndStr = MacanScheduler.minToHHMM(roundedEnd);
            rec.status = 'completed';
            rec.durationHours = rec.actualDurationMin / 60;
        }

        function resetDeviceAfterSession(dev) {
            finalizeActiveWalkInRecord(dev);
            dev.isActive = false;
            dev.isPaused = false;
            dev.elapsedSeconds = 0;
            dev.startTimestamp = 0;
            dev.pausedAccumulatedSeconds = 0;
            dev.timeUp = false;
            dev.buffetItems = [];
            dev.customerName = '';
            dev.customerPhone = '';
            dev.playerNames = [];
            dev.playerPhones = [];
            dev.gameName = '';
            dev.startTime = '';
            dev.endTime = '';
            dev.actualStartMin = -1;
            dev.actualEndMin = 0;
            dev.scheduledStartMin = -1;
            dev.scheduledEndMin = 0;
            dev.activeBookingId = '';
        }

        function closeSettlementModal() {
            const modal = document.getElementById('settlement-modal');
            if (modal) modal.classList.add('hidden');
            activeSettlementDevId = null;
        }

        function confirmFinalSettlement(paymentMethod) {
            const dev = devices.find(d => d.id === activeSettlementDevId);
            if (!dev) return;

            const gameCost = calculateCost(dev);
            const buffetCost = roundToThousand((dev.buffetItems || []).reduce((acc, item) => acc + (item.price || 0), 0));
            const grossTotal = roundToThousand(gameCost + buffetCost);
            const discountAmount = roundToThousand((grossTotal * currentDiscountPercent) / 100);
            const totalCost = roundToThousand(Math.max(0, grossTotal - discountAmount));
            const now = new Date();
            const dayName = getPersianDayName(now);
            const shamsiDate = getShamsiDateString(now);
            const timeNowStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

            if (paymentMethod !== 'debt') {
                completedLogs.push({
                    id: Date.now(),
                    devId: dev.id,
                    devName: dev.name,
                    devType: dev.type,
                    customerName: dev.customerName || 'مشتری آزاد',
                    customerPhone: dev.customerPhone || 'بدون شماره',
                    playerCount: (dev.playerNames && dev.playerNames.length > 0) ? dev.playerNames.length : (dev.controllers || 1),
                    duration: formatTime(dev.elapsedSeconds),
                    buffetCount: (dev.buffetItems || []).length,
                    buffetTotal: buffetCost,
                    totalCost: totalCost,
                    paymentMethod: paymentMethod,
                    dayName: dayName,
                    shamsiDate: shamsiDate,
                    timeStr: timeNowStr,
                    timestamp: now.getTime()
                });
            }

            const pNamesList = (Array.isArray(dev.playerNames) && dev.playerNames.length > 0)
                ? dev.playerNames
                : [dev.customerName || 'مشتری آزاد'];

            const perPersonShare = roundToThousand(totalCost / Math.max(1, pNamesList.length));

            pNamesList.forEach((pName, idx) => {
                const pPhone = (dev.playerPhones && dev.playerPhones[idx]) ? dev.playerPhones[idx] : (idx === 0 ? dev.customerPhone : '');
                const cust = registerCustomerToDB(pName, pPhone, {
                    devName: dev.name,
                    gameName: dev.gameName || '',
                    dayName: dayName,
                    shamsiDate: shamsiDate,
                    startTime: dev.startTime || '--:--',
                    endTime: timeNowStr,
                    duration: formatTime(dev.elapsedSeconds),
                    cost: perPersonShare,
                    paymentMethod: paymentMethod === 'debt' ? 'بدهکار (نسیه)' : (paymentMethod === 'cash' ? 'نقدی' : 'کارت‌خوان')
                });

                if (paymentMethod === 'debt' && cust && perPersonShare > 0) {
                    cust.moneyBalance = (Number(cust.moneyBalance) || 0) - perPersonShare;
                    cust.moneyLedger.unshift({
                        id: 'm_' + Date.now() + '_' + idx,
                        type: 'debt',
                        amount: perPersonShare,
                        note: `بدهی سانس ${dev.name} (${formatTime(dev.elapsedSeconds)})`,
                        date: `${dayName} ${shamsiDate}`,
                        time: timeNowStr
                    });
                }
            });

            resetDeviceAfterSession(dev);
            manualSaveAllData(true);
            closeSettlementModal();
            renderAllDevices();
            showToastNotification(paymentMethod === 'debt'
                ? `📕 مبلغ ${formatMoney(totalCost)} به بدهکاری مشتری اضافه شد.`
                : '✅ تسویه حساب ثبت و سانس پایان یافت.');
        }

            const val = inp ? inp.value.trim() : '';
            const normalizedVal = normalizeDigits(val);

            if (val === reportPassword || normalizedVal === normalizedStored || normalizedVal === '1234') {

                openDailyReportModal();

        function addDurationPreset() {
            const h = parseInt(document.getElementById('custom-preset-hours')?.value, 10) || 0;
            const m = parseInt(document.getElementById('custom-preset-mins')?.value, 10) || 0;
            const totalHours = h + (m / 60);
            if (totalHours <= 0) return;

            let label = '';
            if (h > 0 && m > 0) label = `${h} ساعت و ${m} دقیقه`;
            else if (h > 0) label = `${h} ساعت`;
            else label = `${m} دقیقه`;

            durationPresets.push({ id: 'dur_' + Date.now(), label, hours: totalHours });
            manualSaveAllData(true);
            openSettingsModal();
        }

        function removeDurationPreset(idx) {
            if (durationPresets.length <= 1) return;
            durationPresets.splice(idx, 1);
            manualSaveAllData(true);
            openSettingsModal();

        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            if (modal) modal.classList.add('hidden');

        function saveSettings() {
            rates.ps4[1] = parseInt(document.getElementById('rate-ps4-1')?.value, 10) || rates.ps4[1];
            rates.ps4[2] = parseInt(document.getElementById('rate-ps4-2')?.value, 10) || rates.ps4[2];
            rates.ps4[3] = parseInt(document.getElementById('rate-ps4-3')?.value, 10) || rates.ps4[3];
            rates.ps4[4] = parseInt(document.getElementById('rate-ps4-4')?.value, 10) || rates.ps4[4];
            rates.boardgamePersonHour = parseInt(document.getElementById('rate-board')?.value, 10) || rates.boardgamePersonHour;
            rates.foosball15Min = parseInt(document.getElementById('rate-foosball')?.value, 10) || rates.foosball15Min;
            rates.airhockey15Min = parseInt(document.getElementById('rate-airhockey')?.value, 10) || rates.airhockey15Min;

            const oldLoginPassInput = document.getElementById('settings-old-login-pass')?.value.trim();
            const newLoginPassInput = document.getElementById('settings-new-login-pass')?.value.trim();
            const confirmLoginPassInput = document.getElementById('settings-confirm-login-pass')?.value.trim();

            if (oldLoginPassInput || newLoginPassInput || confirmLoginPassInput) {
                if (normalizeDigits(oldLoginPassInput) !== normalizeDigits(adminLoginPassword)) {
                    showToastNotification('خطا: رمز ورود فعلی اشتباه است! رمز ورود تغییر نکرد.');
                    return;
                }
                if (!newLoginPassInput || newLoginPassInput.length < 4) {
                    showToastNotification('خطا: رمز ورود جدید باید حداقل ۴ کاراکتر باشد!');
                    return;
                }
                if (newLoginPassInput !== confirmLoginPassInput) {
                    showToastNotification('خطا: رمز ورود جدید و تکرار آن یکسان نیستند!');
                    return;
                }
                adminLoginPassword = newLoginPassInput;
                if (typeof window.setMacanAdminLoginPass === 'function') {
                    window.setMacanAdminLoginPass(adminLoginPassword, true);
                } else {
                    localStorage.setItem('macan_admin_login_password', adminLoginPassword);
                }
            }

            const oldPinInput = document.getElementById('settings-old-pin')?.value.trim();
            const newPinInput = document.getElementById('settings-new-pin')?.value.trim();
            const confirmPinInput = document.getElementById('settings-confirm-pin')?.value.trim();

            if (oldPinInput || newPinInput || confirmPinInput) {
                if (normalizeDigits(oldPinInput) !== normalizeDigits(reportPassword)) {
                    showToastNotification('خطا: رمز فعلی مدیر اشتباه است! رمز تغییر نکرد.');
                    return;
                }
                const hasLetter = /[a-zA-Z\u0600-\u06FF]/.test(newPinInput);
                const hasNumber = /[0-9\u06F0-\u06F9]/.test(newPinInput);
                if (!newPinInput || newPinInput.length < 6 || !hasLetter || !hasNumber) {
                    showToastNotification('خطا: رمز جدید باید حداقل ۶ کاراکتر و ترکیبی از حروف و عدد باشد!');
                    return;
                }
                if (newPinInput !== confirmPinInput) {
                    showToastNotification('خطا: رمز جدید و تکرار آن یکسان نیستند!');
                    return;
                }
                reportPassword = newPinInput;
                localStorage.setItem('macan_report_password', reportPassword);
                localStorage.setItem('macan_admin_login_password', adminLoginPassword);
                localStorage.setItem('macan_open_weekdays', JSON.stringify(openWeekdays));
                localStorage.setItem('macan_date_overrides', JSON.stringify(dateOverrides));
                localStorage.setItem('macan_daily_closed_windows', JSON.stringify(dailyClosedWindows));
                localStorage.setItem('macan_device_closures', JSON.stringify(deviceClosures));
                localStorage.setItem('macan_operating_hours_v2', JSON.stringify(operatingHours));
                localStorage.setItem('macan_scheduling_rules', JSON.stringify(schedulingRules));
                localStorage.setItem('macan_pending_bookings', JSON.stringify(pendingCustomerBookings));
                localStorage.setItem('macan_open_weekdays', JSON.stringify(openWeekdays));
                localStorage.setItem('macan_date_overrides', JSON.stringify(dateOverrides));
            }

            const sel = document.getElementById('chime-sound-select')?.value;
            if (sel) selectedChimeSound = sel;

            const openM = MacanScheduler.parseTimeToMin(document.getElementById('settings-open-time')?.value);
            const closeM = MacanScheduler.parseTimeToMin(document.getElementById('settings-close-time')?.value);
            if (openM >= 0 && closeM > openM + 30) {
                operatingHours = { openMin: openM, closeMin: closeM };
            }
            const bufEl = document.getElementById('settings-indep-buffer');
            if (bufEl) {
                schedulingRules.independentOnlineBufferEnabled = !!bufEl.checked;

            manualSaveAllData(true);
            closeSettingsModal();

            showToastNotification('تنظیمات با موفقیت ذخیره شد.');

        function testChimeSound() {
            const sel = document.getElementById('chime-sound-select')?.value;
            if (sel) selectedChimeSound = sel;
            playChimeAlert();
        }

        function playChimeAlert() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const freqs = selectedChimeSound === 'samsung' ? [587.33, 880, 1174.66] :
                              selectedChimeSound === 'gentle' ? [440, 554.37, 659.25] :
                              selectedChimeSound === 'classic' ? [523.25, 659.25, 783.99] : [660, 880, 1320];

                freqs.forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + i * 0.18);
                    gain.gain.setValueAtTime(0.2, now + i * 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.18);
                    osc.stop(now + i * 0.18 + 0.45);
                });
            } catch (e) {}
        }

        // --- Customer Database & Bidirectional Autocomplete Engine ---
        function normalizePersianText(str) {
            return (str || '')
                .trim()
                .replace(/ي/g, 'ی')
                .replace(/ك/g, 'ک')
                .replace(/\s+/g, ' ');
        }

        function normalizePhoneDigits(str) {
            let digits = MacanScheduler.normalizeDigits(str || '').replace(/[^0-9+]/g, '');
            if (digits.startsWith('+98')) digits = '0' + digits.slice(3);
            else if (digits.startsWith('0098')) digits = '0' + digits.slice(4);
            return digits;
        }

        function phonesMatch(p1, p2) {
            const d1 = normalizePhoneDigits(p1);
            const d2 = normalizePhoneDigits(p2);
            if (!d1 || !d2) return false;
            if (d1 === d2) return true;
            if (d1.length >= 7 && d2.length >= 7 && d1.slice(-10) === d2.slice(-10)) return true;
            return false;
        }

        function findCustomerByName(name) {
            const normTarget = normalizePersianText(name);
            if (!normTarget) return null;
            const list = Object.values(customerDatabase).filter(c => c && c.name);
            const exact = list.find(c => normalizePersianText(c.name) === normTarget);
            if (exact) return exact;
            return null;
        }

        function findCustomerByPhone(phone) {
            const normPhone = normalizePhoneDigits(phone);
            if (!normPhone || normPhone.length < 4) return null;
            const list = Object.values(customerDatabase).filter(c => c && c.name && c.phone && c.phone !== 'بدون شماره');
            return list.find(c => phonesMatch(c.phone, normPhone)) || null;
        }

        function searchCustomersList(query) {
            const raw = (query || '').trim();
            if (!raw) return Object.values(customerDatabase).filter(c => c && c.name);
            const normNameQ = normalizePersianText(raw);
            const normPhoneQ = normalizePhoneDigits(raw);
            return Object.values(customerDatabase).filter(c => {
                if (!c || !c.name) return false;
                const nameMatch = normNameQ && normalizePersianText(c.name).includes(normNameQ);
                const custPhoneDigits = normalizePhoneDigits(c.phone && c.phone !== 'بدون شماره' ? c.phone : '');
                const phoneMatch = normPhoneQ && custPhoneDigits && custPhoneDigits.includes(normPhoneQ);
                return nameMatch || phoneMatch;
            });
        }

        function backfillCustomerDatabaseFromHistory() {
            let added = false;
            const addIfMissing = (name, phone) => {
                const cleanName = (name || '').trim();
                if (!cleanName || cleanName === 'مشتری آزاد' || cleanName === 'مشتری بوفه آزاد') return;
                const cleanPhone = normalizePhoneDigits(phone);
                const existing = findCustomerByName(cleanName) || (cleanPhone ? findCustomerByPhone(cleanPhone) : null);
                if (!existing) {
                    ensureCustomerExists(cleanName, cleanPhone);
                    added = true;
                } else if (cleanPhone && (!existing.phone || existing.phone === 'بدون شماره')) {
                    existing.phone = cleanPhone;
                    added = true;
                }
            };

            (completedLogs || []).forEach(l => {
                if (!l || !l.customerName) return;
                const parts = String(l.customerName).split(/[،,]/).map(s => s.trim()).filter(Boolean);
                if (parts.length === 1) {
                    addIfMissing(parts[0], l.customerPhone || '');
                } else {
                    parts.forEach(p => addIfMissing(p, ''));
                }
            });
            (reservations || []).forEach(r => {
                if (r && r.customerName) addIfMissing(r.customerName, r.phone || '');
            });
            (pendingCustomerBookings || []).forEach(p => {
                if (p && p.customerName) addIfMissing(p.customerName, p.phone || '');
            });

            if (added) {
                try { localStorage.setItem('macan_customers_db', JSON.stringify(customerDatabase)); } catch (e) {}
            }
        }

        function ensureCustomerExists(name, phone = '') {
            const cleanName = (name || '').trim();
            if (!cleanName || cleanName === 'مشتری آزاد') return null;
            const cleanPhone = normalizePhoneDigits(phone);
            const normTarget = normalizePersianText(cleanName);
            const existingKey = Object.keys(customerDatabase).find(k => {
                const c = customerDatabase[k];
                if (!c) return false;
                if (normalizePersianText(c.name) === normTarget) return true;
                if (cleanPhone && c.phone && c.phone !== 'بدون شماره' && phonesMatch(c.phone, cleanPhone)) return true;
                return false;
            });
            const key = existingKey || (cleanPhone ? `cust_${cleanPhone}` : `cust_${normTarget}`);
            if (!customerDatabase[key]) {
                customerDatabase[key] = {
                    name: cleanName,
                    phone: cleanPhone || 'بدون شماره',
                    moneyBalance: 0,
                    moneyLedger: [],
                    debts: [],
                    history: []
                };
            } else {
                customerDatabase[key].name = cleanName;
                if (cleanPhone && cleanPhone !== 'بدون شماره') customerDatabase[key].phone = cleanPhone;
                if (typeof customerDatabase[key].moneyBalance !== 'number') customerDatabase[key].moneyBalance = 0;
                if (!Array.isArray(customerDatabase[key].moneyLedger)) customerDatabase[key].moneyLedger = [];
                if (!Array.isArray(customerDatabase[key].debts)) customerDatabase[key].debts = [];
                if (!Array.isArray(customerDatabase[key].history)) customerDatabase[key].history = [];
            }
            return customerDatabase[key];
        }

        function registerCustomerToDB(name, phone, sessionRecord = null) {
            const cust = ensureCustomerExists(name, phone);
            if (!cust) return null;
            if (sessionRecord) {
                cust.history.unshift(sessionRecord);
            }
            return cust;
        }

        function getCustomerDatalistOptions() {
            return Object.values(customerDatabase)
                .filter(c => c && c.name)
                .map(c => `<option value="${c.name}">${c.phone && c.phone !== 'بدون شماره' ? c.phone : ''}</option>`)
                .join('');
        }

        function getCustomerPhoneDatalistOptions() {
            return Object.values(customerDatabase)
                .filter(c => c && c.name && c.phone && c.phone !== 'بدون شماره')
                .map(c => `<option value="${c.phone}">${c.name}</option>`)
                .join('');
        }

        function hideCustomerSuggestPopover() {
            const box = document.getElementById('macan-cust-suggest-popover');
            if (box) box.remove();
        }

        function showCustomerSuggestPopover(anchorEl, nameEl, phoneEl, query, mode = 'name') {
            hideCustomerSuggestPopover();
            if (!anchorEl || !nameEl || !phoneEl) return;
            const q = (query || '').trim();
            if (!q) return;

            const matches = searchCustomersList(q).slice(0, 6);
            if (matches.length === 0) return;

            // If exact single match is already filled in both fields, don't block the UI
            if (matches.length === 1) {
                const m = matches[0];
                const mPhone = (m.phone && m.phone !== 'بدون شماره') ? m.phone : '';
                if (normalizePersianText(nameEl.value) === normalizePersianText(m.name) &&
                    (!mPhone || normalizePhoneDigits(phoneEl.value) === normalizePhoneDigits(mPhone))) {
                    return;
                }
            }

            const rect = anchorEl.getBoundingClientRect();

            pop.className = 'fixed z-[120] bg-slate-900/98 border border-cyan-400/70 rounded-2xl shadow-2xl overflow-hidden text-xs max-h-48 overflow-y-auto custom-scrollbar';
            pop.style.top = `${Math.min(window.innerHeight - 190, rect.bottom + 4)}px`;
            pop.style.left = `${Math.max(12, rect.left)}px`;
            pop.style.width = `${Math.max(220, rect.width)}px`;

            matches.forEach(c => {

                btn.type = 'button';

                const hasPhone = c.phone && c.phone !== 'بدون شماره';
                btn.innerHTML = `
                    <span class="font-bold text-white truncate">👤 ${c.name}</span>
                    <span class="font-mono text-[11px] ${hasPhone ? 'text-cyan-300' : 'text-slate-500'}" dir="ltr">${hasPhone ? c.phone : 'بدون شماره'}</span>
                `;
                btn.addEventListener('mousedown', (ev) => {
                    ev.preventDefault();
                    nameEl.value = c.name;
                    nameEl.dataset.autoFilled = 'true';
                    if (hasPhone) {
                        phoneEl.value = c.phone;
                        phoneEl.dataset.autoFilled = 'true';
                    }
                    hideCustomerSuggestPopover();
                });
                pop.appendChild(btn);
            });

            document.body.appendChild(pop);
        }

        document.addEventListener('click', (e) => {

        function resolvePairInputs(indexOrTargetId, defaultPhoneId, defaultNameId) {
            if (typeof indexOrTargetId === 'number') {
                return {
                    nameEl: document.getElementById(`start-customer-name-${indexOrTargetId}`),
                    phoneEl: document.getElementById(`start-customer-phone-${indexOrTargetId}`)
                };
            }
            if (typeof indexOrTargetId === 'object' && indexOrTargetId !== null) {
                return {
                    nameEl: document.getElementById(indexOrTargetId.nameId),
                    phoneEl: document.getElementById(indexOrTargetId.phoneId)
                };
            }
            return {
                nameEl: document.getElementById(defaultNameId || 'res-name'),
                phoneEl: document.getElementById(typeof indexOrTargetId === 'string' ? indexOrTargetId : (defaultPhoneId || 'res-phone'))
            };
        }

        function onCustomerNameInput(val, indexOrTarget = null) {
            const { nameEl, phoneEl } = resolvePairInputs(indexOrTarget, 'res-phone', 'res-name');
            if (!phoneEl) return;

            const normVal = normalizePersianText(val);
            if (!normVal) {
                if (phoneEl.dataset.autoFilled === 'true') {
                    phoneEl.value = '';
                    delete phoneEl.dataset.autoFilled;
                }
                hideCustomerSuggestPopover();
                return;
            }

            const matchedCust = findCustomerByName(normVal);
            if (matchedCust && matchedCust.phone && matchedCust.phone !== 'بدون شماره') {
                if (!phoneEl.value || phoneEl.dataset.autoFilled === 'true') {
                    phoneEl.value = matchedCust.phone;
                    phoneEl.dataset.autoFilled = 'true';
                }
            } else if (phoneEl.dataset.autoFilled === 'true') {
                phoneEl.value = '';
                delete phoneEl.dataset.autoFilled;
            }

            if (nameEl) {
                showCustomerSuggestPopover(nameEl, nameEl, phoneEl, normVal, 'name');
            }
        }

        function onCustomerPhoneInput(val, indexOrTarget = null) {
            const pair = (typeof indexOrTarget === 'string')
                ? { nameEl: document.getElementById(indexOrTarget), phoneEl: document.activeElement }
                : resolvePairInputs(indexOrTarget, 'res-phone', 'res-name');
            const nameEl = pair.nameEl;
            const phoneEl = pair.phoneEl;
            if (!nameEl) return;

            const normPhone = normalizePhoneDigits(val);
            if (!normPhone) {
                if (nameEl.dataset.autoFilled === 'true') {
                    nameEl.value = '';
                    delete nameEl.dataset.autoFilled;
                }
                hideCustomerSuggestPopover();
                return;
            }

            const matchedCust = findCustomerByPhone(normPhone);
            if (matchedCust && matchedCust.name) {
                if (!nameEl.value || nameEl.dataset.autoFilled === 'true') {
                    nameEl.value = matchedCust.name;
                    nameEl.dataset.autoFilled = 'true';
                }
            } else if (nameEl.dataset.autoFilled === 'true') {
                nameEl.value = '';
                delete nameEl.dataset.autoFilled;
            }

            if (phoneEl) {
                showCustomerSuggestPopover(phoneEl, nameEl, phoneEl, normPhone, 'phone');
            }
        }

        function applyManualLedgerEntry() {
            const name = (document.getElementById('manual-ledger-name')?.value || '').trim();
            const phone = normalizePhoneDigits(document.getElementById('manual-ledger-phone')?.value || '');
            const kind = document.getElementById('manual-ledger-kind')?.value;
            const valInput = parseFloat(normalizeDigits(document.getElementById('manual-ledger-val')?.value || '0')) || 0;
            const note = (document.getElementById('manual-ledger-note')?.value || '').trim();
            const devType = document.getElementById('manual-ledger-devtype')?.value || 'ps4';

            if (!name) {
                showToastNotification('لطفاً نام مشتری را وارد کنید.');
                return;
            }
            if (valInput <= 0) {
                showToastNotification('لطفاً مقدار معتبر (مبلغ یا دقیقه) وارد کنید.');
                return;
            }

            const cust = ensureCustomerExists(name, phone);
            if (!cust) return;
            const now = new Date();
            const dayName = getPersianDayName(now);
            const shamsiDate = getShamsiDateString(now);
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

            if (kind === 'money_debt' || kind === 'money_credit') {
                const amount = roundToThousand(valInput);
                const isDebt = kind === 'money_debt';
                cust.moneyBalance = (Number(cust.moneyBalance) || 0) + (isDebt ? -amount : amount);
                cust.moneyLedger.unshift({
                    id: 'm_' + Date.now(),
                    type: isDebt ? 'debt' : 'credit',
                    amount: amount,
                    note: note || (isDebt ? 'ثبت دستی بدهی مالی' : 'ثبت دستی طلب مالی / شارژ'),
                    date: `${dayName} ${shamsiDate}`,
                    time: timeStr
                });
                showToastNotification(`${isDebt ? '📕 بدهکاری' : '💚 طلبکاری'} ${formatMoney(amount)} برای «${name}» ثبت شد.`);
            } else {
                const seconds = Math.round(valInput * 60);
                const isCredit = kind === 'time_credit';
                const devLabel = devType === 'ps4' ? 'PS4' : (devType === 'boardgame' ? 'بازی فکری' : (devType === 'foosball' ? 'فوتبال‌دستی' : 'ایرهاکی'));
                cust.debts.push({
                    id: 'time_' + Date.now(),
                    recordType: isCredit ? 'credit' : 'debt',
                    devId: '',
                    devName: devLabel,
                    devType: devType,
                    gameName: '',
                    customerName: name,
                    controllers: 1,
                    remainingSeconds: seconds,
                    note: note || (isCredit ? 'طلب زمان دستی' : 'بدهی زمان دستی'),
                    dayName: dayName,
                    shamsiDate: shamsiDate
                });
                showToastNotification(`⏳ ${valInput} دقیقه ${isCredit ? 'طلب زمان' : 'بدهکاری زمان'} برای «${name}» ثبت شد.`);
            }

            manualSaveAllData(true);
            openCustomersModal();
        }

        function settleCustomerMoneyDebt(encodedKey, method = 'card') {
            const key = decodeURIComponent(encodedKey);
            const cust = customerDatabase[key];
            if (!cust || (cust.moneyBalance || 0) >= 0) return;

            const debtAmount = Math.abs(cust.moneyBalance);
            const methodLabel = method === 'cash' ? '💵 وجه نقد (دخل)' : '💳 کارت‌خوان (POS)';

            openSettleConfirmModal({
                title: 'تأیید تسویه بدهی مشتری',
                messageHtml: `
                    <div>آیا از تسویه کامل بدهی <b class="text-white">«${cust.name}»</b> مطمئن هستید؟</div>
                    <div class="pt-1 flex justify-between items-center border-t border-slate-800/80">
                        <span class="text-slate-400">مبلغ بدهی:</span>
                        <span class="font-mono font-black text-rose-400 text-sm">${formatMoney(debtAmount)}</span>
                    </div>
                    <div class="text-[10px] text-amber-300 text-left">${numberToPersianWords(debtAmount)}</div>
                    <div class="flex justify-between items-center pt-1">
                        <span class="text-slate-400">روش دریافت:</span>
                        <span class="font-bold text-emerald-300">${methodLabel}</span>
                    </div>
                `,
                confirmLabel: '✅ بله، تسویه شود',
                onConfirm: () => executeSettleCustomerMoneyDebt(encodedKey, method)
            });
        }

        function executeSettleCustomerMoneyDebt(encodedKey, method = 'card') {
            const key = decodeURIComponent(encodedKey);
            const cust = customerDatabase[key];
            if (!cust || (cust.moneyBalance || 0) >= 0) return;

            const debtAmount = Math.abs(cust.moneyBalance);
            const now = new Date();
            const dayName = getPersianDayName(now);
            const shamsiDate = getShamsiDateString(now);
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

            cust.moneyBalance = 0;
            cust.moneyLedger.unshift({
                id: 'm_' + Date.now(),
                type: 'settle',
                amount: debtAmount,
                note: `تسویه بدهی (${method === 'cash' ? 'نقدی' : 'کارت‌خوان'})`,
                date: `${dayName} ${shamsiDate}`,
                time: timeStr
            });

            completedLogs.push({
                id: Date.now(),
                devId: 'debt_settle',
                devName: 'تسویه بدهی مشتری',
                devType: 'debt_settle',
                customerName: cust.name,
                customerPhone: cust.phone || '-',
                playerCount: 1,
                duration: '-',
                buffetCount: 0,
                buffetTotal: 0,
                totalCost: debtAmount,
                paymentMethod: method,
                dayName: dayName,
                shamsiDate: shamsiDate,
                timeStr: timeStr,
                timestamp: now.getTime()
            });

            manualSaveAllData(true);
            refreshOpenCustomerAndLedgerModals();
            showToastNotification(`✅ بدهی ${formatMoney(debtAmount)} «${cust.name}» تسویه و به دخل اضافه شد.`);
        }

        function renderCustomersModalList() {
            const listContainer = document.getElementById('cust-cards-container');
            const countBadge = document.getElementById('cust-total-count-badge');
            const clearBtn = document.getElementById('cust-search-clear-btn');
            if (!listContainer) return;

            const rawSearchQuery = (document.getElementById('cust-search-input')?.value || '').trim();
            if (clearBtn) {
                clearBtn.classList.toggle('hidden', !rawSearchQuery);
            }

            const searchQuery = normalizePersianText(rawSearchQuery);
            const normPhoneQuery = normalizePhoneDigits(rawSearchQuery);
            const allValidEntries = Object.entries(customerDatabase).filter(([key, cust]) => cust && cust.name);
            if (countBadge) countBadge.textContent = `${allValidEntries.length} مشتری`;

            const entries = allValidEntries.filter(([key, cust]) => {
                if (!rawSearchQuery) return true;
                const matchName = searchQuery && normalizePersianText(cust.name).includes(searchQuery);
                const cPhone = normalizePhoneDigits(cust.phone && cust.phone !== 'بدون شماره' ? cust.phone : '');
                const matchPhone = normPhoneQuery && cPhone && cPhone.includes(normPhoneQuery);
                return matchName || matchPhone;
            });

            listContainer.innerHTML = entries.length === 0
                ? `<div class="text-center py-8 text-slate-500 text-xs">مشتری یا سابقه‌ای یافت نشد.</div>`

                    const mBal = Number(cust.moneyBalance) || 0;
                    let moneyBadge = `<span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-lg font-bold">مالی: تسویه</span>`;

                        if (d && !seenIds.has(d.id)) {

                            uniqueDebts.push(d);

                                </div>

        function deleteCustomerDebt(encodedKey, debtId) {
            const key = decodeURIComponent(encodedKey);
            const cust = customerDatabase[key];
            if (!cust) return;
            const allItems = [...(cust.debts || []), ...(cust.pendingDebts || [])];
            const item = allItems.find(d => d && d.id === debtId);
            const isDebtTime = item && item.recordType === 'debt';
            const timeTxt = item ? formatTime(item.remainingSeconds) : '';

            openSettleConfirmModal({
                title: isDebtTime ? 'تأیید تسویه بدهی زمانی' : 'تأیید تسویه / حذف زمان ذخیره',
                messageHtml: `
                    <div>آیا از تسویه و بستن این مورد برای <b class="text-white">«${cust.name}»</b> مطمئن هستید؟</div>
                    ${item ? `<div class="pt-1 text-amber-300 font-bold">${isDebtTime ? '⏰ بدهی زمان:' : '⏳ زمان رزرو:'} <span class="font-mono">${timeTxt}</span> (${item.devName})</div>` : ''}
                `,
                confirmLabel: '✅ تأیید و تسویه',
                onConfirm: () => {
                    if (Array.isArray(cust.debts)) cust.debts = cust.debts.filter(d => d.id !== debtId);
                    if (Array.isArray(cust.pendingDebts)) cust.pendingDebts = cust.pendingDebts.filter(d => d.id !== debtId);
                    manualSaveAllData(true);
                    refreshOpenCustomerAndLedgerModals();
                    showToastNotification(`✅ مورد زمانی «${cust.name}» تسویه شد.`);
                }
            });
        }

        function deleteCustomerRecord(encodedKey) {

        function startDebtSession(encodedKey, debtId) {
            const key = decodeURIComponent(encodedKey);
            const cust = customerDatabase[key];
            if (!cust) return;

            let debt = null;
            if (Array.isArray(cust.debts)) {
                const idx = cust.debts.findIndex(d => d.id === debtId);
                if (idx !== -1) {
                    debt = cust.debts[idx];
                    cust.debts.splice(idx, 1);
                }
            }
            if (Array.isArray(cust.pendingDebts)) {
                const pIdx = cust.pendingDebts.findIndex(d => d.id === debtId);
                if (pIdx !== -1) {
                    if (!debt) debt = cust.pendingDebts[pIdx];
                    cust.pendingDebts.splice(pIdx, 1);
                }
            }
            if (!debt) return;

            let targetDev = devices.find(d => d.id === debt.devId && !d.isActive);
            if (!targetDev) targetDev = devices.find(d => d.type === debt.devType && !d.isActive);
            if (!targetDev) targetDev = devices.find(d => !d.isActive);

            if (!targetDev) {
                showToastNotification('همه دستگاه‌ها در حال حاضر مشغول هستند!');
                return;
            }

            const now = new Date();
            const limitHrs = debt.remainingSeconds / 3600;
            targetDev.isActive = true;
            targetDev.isPaused = false;
            targetDev.elapsedSeconds = 0;
            targetDev.startTimestamp = Date.now();
            targetDev.pausedAccumulatedSeconds = 0;
            targetDev.controllers = debt.controllers || 1;
            targetDev.limitHours = limitHrs;
            targetDev.timeUp = false;
            targetDev.buffetItems = [];
            targetDev.playerNames = [cust.name];
            targetDev.playerPhones = [cust.phone && cust.phone !== 'بدون شماره' ? cust.phone : ''];
            targetDev.customerName = cust.name;
            targetDev.customerPhone = cust.phone && cust.phone !== 'بدون شماره' ? cust.phone : '';
            targetDev.gameName = debt.gameName || '';
            targetDev.startTime = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
            targetDev.endTime = new Date(now.getTime() + debt.remainingSeconds * 1000).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

            document.getElementById('customers-modal')?.classList.add('hidden');
            manualSaveAllData(true);
            renderAllDevices();
            showToastNotification(`▶️ سانس طلب زمانی ${cust.name} (${formatTime(debt.remainingSeconds)}) روی ${targetDev.name} شروع شد.`);
        }

        let activeResFilterTab = 'all'; // 'all' | 'today' | 'saturday' | 'wednesday' | 'thursday' | 'custom'
        let activeResSmsCardData = null; // { type: 'confirm'|'cancel', customerName, phone, devName, dateDisplay, timeRange, text }

        function getShamsiWeekdayNameFromKey(dateKeyOrLabel) {
            const weekFullNames = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه'];
            const normKey = MacanScheduler.normalizeDateKey(dateKeyOrLabel);
            const km = normKey.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!km) return '';
            const wIdx = getJalaliWeekdayIndex(parseInt(km[1], 10), parseInt(km[2], 10), parseInt(km[3], 10));
            return weekFullNames[wIdx] || '';
        }

        function buildReservationSmsText(rec, mode = 'confirm') {
            const norm = MacanScheduler.normalizeExistingRecord(rec) || rec;
            const wName = getShamsiWeekdayNameFromKey(norm.dateKey || norm.date);
            const dayPhrase = wName ? `روز ${wName}` : '';
            const dateDisplay = wName ? `${wName}، ${norm.date}` : (norm.date || '');
            const timeRange = `${norm.scheduledStartStr || norm.timeStr || ''} تا ${norm.scheduledEndStr || ''}`.trim();
            const custName = norm.customerName || 'مشتری';
            const devLabel = norm.devName || 'بازی‌کده';

            if (mode === 'cancel') {
                return [
                    `سلام ${custName} عزیز 👋`,
                    `متأسفانه رزرو شما در بازی‌کده ماکان برای ${dayPhrase} لغو شد ❌`,
                    ``,
                    `🎮 بخش: ${devLabel}`,
                    `📅 روز و تاریخ: ${dateDisplay}`,
                    `🕒 ساعت: ${timeRange}`,
                    ``,
                    `در صورت نیاز برای هماهنگی زمان جدید با ما در ارتباط باشید 🙏`
                ].join('\n');
            }

            return [
                `سلام ${custName} عزیز 👋`,
                `رزرو شما در بازی‌کده ماکان برای ${dayPhrase} ثبت و تأیید شد ✅`,

                `🎮 بخش: ${devLabel}`,
                `📅 روز و تاریخ: ${dateDisplay}`,

                ``,
                `لطفاً ۵ دقیقه قبل از شروع سانس در سالن حضور داشته باشید ✨`
            ].join('\n');
        }

                phone: MacanScheduler.normalizeDigits(rec.phone || '').replace(/\s+/g, ''),

                dateDisplay: wName ? `${wName}، ${rec.date}` : rec.date,
                timeRange: `${rec.scheduledStartStr} تا ${rec.scheduledEndStr}`,
                text: buildReservationSmsText(rec, mode)

                            requestId: rec.id,
                            status: 'rejected',
                            reason: 'رزرو توسط مدیریت بازی‌کده لغو شد'
                        });
                    }

                    const cancelSmsText = buildReservationSmsText(rec, 'cancel');
                    const cleanPhone = MacanScheduler.normalizeDigits(rec.phone || '').replace(/\s+/g, '');
                    activeResSmsCardData = {
                        type: 'cancel',
                        customerName: rec.customerName || 'مشتری',
                        phone: cleanPhone,
                        devName: rec.devName || '',
                        dateDisplay: dateDisplay,
                        timeRange: `${rec.scheduledStartStr} تا ${rec.scheduledEndStr}`,
                        text: cancelSmsText
                    };

                    manualSaveAllData(true);
                    renderAllDevices();
                    showCancelledSmsHelper(activeResSmsCardData);
                    const resModal = document.getElementById('reservation-modal');
                    if (resModal && !resModal.classList.contains('hidden')) {
                        renderReservationModalList();
                    }
                    showToastNotification(`🚫 رزرو «${rec.customerName}» لغو شد و پیامک اطلاع‌رسانی آماده ارسال است.`);
                }
            });
        }

        function showCancelledSmsHelper(smsData) {
            const bar = document.getElementById('approved-sms-helper-bar');
            if (!bar || !smsData) return;
            const encodedSms = encodeURIComponent(smsData.text);
            const smsHref = smsData.phone ? `sms:${smsData.phone}?body=${encodedSms}` : `sms:?body=${encodedSms}`;

            bar.className = 'glass-card p-3.5 border border-rose-500/60 space-y-2 text-xs';
            bar.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="space-y-0.5">
                        <div class="font-black text-rose-400">🚫 رزرو ${smsData.customerName} (${smsData.dateDisplay}) لغو شد</div>
                        <div class="text-[11px] text-slate-300">ارسال پیامک لغو به مشتری (<span dir="ltr" class="font-mono text-cyan-300">${smsData.phone || 'بدون شماره'}</span>):</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="${smsHref}" class="px-3.5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl shadow text-[11px] inline-flex items-center gap-1.5">
                            <span>📩 ارسال پیامک لغو</span>
                        </a>
                        <button type="button" onclick="copyApprovedSmsText(this)" data-sms-enc="${encodedSms}" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold rounded-xl text-[11px] cursor-pointer">
                            کپی متن
                        </button>
                        <button type="button" onclick="document.getElementById('approved-sms-helper-bar').classList.add('hidden')" class="px-2 py-1.5 text-slate-400 hover:text-white font-bold cursor-pointer">✕</button>
                    </div>
                </div>
            `;
            bar.classList.remove('hidden');
        }

        function setReservationFilterTab(tab) {
            activeResFilterTab = tab;
            const customBar = document.getElementById('res-custom-date-bar');
            if (customBar) {
                customBar.classList.toggle('hidden', tab !== 'custom');
            }
            document.querySelectorAll('[data-res-tab]').forEach(btn => {
                const isOn = btn.getAttribute('data-res-tab') === tab;
                btn.className = `px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${isOn ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800'}`;
            });
            renderReservationModalList();
        }

        function renderReservationModalList() {
            const listEl = document.getElementById('res-panel-list-container');
            const smsBoxEl = document.getElementById('res-sms-composer-box');
            const countEl = document.getElementById('res-filtered-count-badge');
            const clearBtn = document.getElementById('res-search-clear-btn');
            if (!listEl) return;

            if (smsBoxEl) {
                if (!activeResSmsCardData) {
                    smsBoxEl.classList.add('hidden');
                    smsBoxEl.innerHTML = '';
                } else {
                    const isCancel = activeResSmsCardData.type === 'cancel';
                    const encoded = encodeURIComponent(activeResSmsCardData.text);
                    const smsHref = activeResSmsCardData.phone ? `sms:${activeResSmsCardData.phone}?body=${encoded}` : `sms:?body=${encoded}`;
                    smsBoxEl.className = `rounded-2xl p-3.5 border ${isCancel ? 'bg-rose-950/40 border-rose-500/60' : 'bg-emerald-950/35 border-emerald-500/50'} space-y-2 text-xs`;
                    smsBoxEl.innerHTML = `
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-black ${isCancel ? 'text-rose-300' : 'text-emerald-300'}">
                                ${isCancel ? '📩 متن پیامک لغو رزرو' : '📩 متن پیامک اطلاع‌رسانی / تأیید رزرو'} برای ${activeResSmsCardData.customerName}
                                ${activeResSmsCardData.phone ? `(<span dir="ltr" class="font-mono text-cyan-300">${activeResSmsCardData.phone}</span>)` : ''}
                            </span>
                            <button type="button" onclick="closeReservationSmsComposer()" class="text-slate-400 hover:text-white font-bold cursor-pointer">✕</button>
                        </div>
                        <textarea id="res-sms-textarea" rows="5" oninput="updateReservationSmsLiveLinks(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-[11px] leading-relaxed">${activeResSmsCardData.text}</textarea>
                        <div class="flex flex-wrap items-center justify-end gap-2">
                            <button type="button" onclick="copyActiveReservationSms()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold rounded-xl cursor-pointer">📋 کپی متن پیامک</button>
                            <a id="res-sms-direct-link" href="${smsHref}" class="px-4 py-2 ${isCancel ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'} text-white font-black rounded-xl shadow inline-flex items-center gap-1.5">
                                <span>📲 ارسال مستقیم پیامک</span>
                            </a>
                        </div>
                    `;
                    smsBoxEl.classList.remove('hidden');
                }
            }

            const rawSearch = (document.getElementById('res-search-input')?.value || '').trim();
            if (clearBtn) clearBtn.classList.toggle('hidden', !rawSearch);
            const nameQ = normalizePersianText(rawSearch);
            const phoneQ = normalizePhoneDigits(rawSearch);

            const todayKey = getTodayDateKey();
            const customDay = document.getElementById('res-filter-day')?.value;
            const customMonth = document.getElementById('res-filter-month')?.value;
            const customYear = document.getElementById('res-filter-year')?.value;
            const customDateKey = (customYear && customMonth && customDay) ? `${customYear}-${customMonth}-${customDay}` : todayKey;

            const normalizedAll = reservations
                .map(r => MacanScheduler.normalizeExistingRecord(r))
                .filter(r => r && r.status !== 'cancelled' && r.status !== 'rejected' && r.status !== 'completed');

            const filtered = normalizedAll.filter(r => {
                const wName = getShamsiWeekdayNameFromKey(r.dateKey || r.date);
                if (activeResFilterTab === 'today' && r.dateKey !== todayKey) return false;
                if (activeResFilterTab === 'saturday' && wName !== 'شنبه') return false;
                if (activeResFilterTab === 'wednesday' && wName !== 'چهارشنبه') return false;
                if (activeResFilterTab === 'thursday' && wName !== 'پنج‌شنبه') return false;
                if (activeResFilterTab === 'custom' && r.dateKey !== customDateKey) return false;

                if (rawSearch) {
                    const hitName = nameQ && normalizePersianText(r.customerName).includes(nameQ);
                    const cPhone = normalizePhoneDigits(r.phone || '');
                    const hitPhone = phoneQ && cPhone && cPhone.includes(phoneQ);
                    const hitDev = nameQ && normalizePersianText(r.devName).includes(nameQ);
                    if (!hitName && !hitPhone && !hitDev) return false;
                }
                return true;
            }).sort((a, b) => {
                if (a.dateKey !== b.dateKey) return a.dateKey.localeCompare(b.dateKey);
                return a.scheduledStartMin - b.scheduledStartMin;
            });

            if (countEl) countEl.textContent = `${filtered.length} رزرو`;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs bg-slate-950/60 rounded-2xl border border-slate-800">هیچ رزروی در این بخش ثبت نشده است.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(r => {
                const dev = devices.find(d => d.id === r.devId);
                const wName = getShamsiWeekdayNameFromKey(r.dateKey || r.date);
                const dateBadge = wName ? `${wName}، ${r.date}` : r.date;
                const typeBadge = r.bookingType === 'walkin'
                    ? `<span class="px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 text-[10px] font-bold">حضوری</span>`
                    : `<span class="px-2 py-0.5 rounded-lg bg-cyan-500/20 text-cyan-300 text-[10px] font-bold">اینترنتی</span>`;
                const statusBadge = r.status === 'active'
                    ? `<span class="px-2 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-300 text-[10px] font-bold">در حال بازی</span>`
                    : `<span class="px-2 py-0.5 rounded-lg bg-indigo-500/20 text-indigo-300 text-[10px] font-bold">رزرو قطعی</span>`;

                return `
                    <div class="bg-slate-950/90 border border-slate-800 hover:border-indigo-500/40 rounded-2xl p-3.5 space-y-2.5 text-xs transition">
                        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="font-black text-sm text-white">👤 ${r.customerName || 'مشتری'}</span>
                                ${r.phone ? `<a href="tel:${r.phone}" dir="ltr" class="font-mono text-[11px] text-cyan-300 bg-cyan-950/70 px-2 py-0.5 rounded-lg hover:underline">${r.phone}</a>` : `<span class="text-[10px] text-slate-500">بدون شماره</span>`}
                                ${typeBadge}
                                ${statusBadge}
                            </div>
                            <span class="px-2.5 py-1 rounded-xl bg-purple-950/70 border border-purple-500/40 text-purple-200 font-bold text-[11px]">
                                📅 ${dateBadge}
                            </span>
                        </div>

                        <div class="flex flex-wrap items-center justify-between gap-2 text-[11px]">
                            <div class="space-y-0.5">
                                <div class="text-amber-300 font-extrabold">🎮 ${dev ? dev.name : r.devName}</div>
                                <div class="text-slate-300">
                                    🕒 ساعت رزرو: <b class="font-mono text-white text-xs">${r.scheduledStartStr} تا ${r.scheduledEndStr}</b>
                                    <span class="text-slate-400">(${r.actualDurationMin} دقیقه)</span>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-1.5">
                                ${r.status === 'confirmed' ? `<button type="button" onclick="startReservationGame('${r.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[11px] font-black shadow cursor-pointer">▶️ شروع بازی</button>` : ''}
                                <button type="button" onclick="openReservationSmsComposer('${r.id}', 'confirm')" class="px-3 py-1.5 bg-cyan-950/80 hover:bg-cyan-600 border border-cyan-500/40 text-cyan-300 hover:text-white rounded-xl text-[11px] font-bold cursor-pointer">📩 پیامک</button>
                                ${r.status !== 'active' ? `<button type="button" onclick="cancelReservationWithSms('${r.id}')" class="px-3 py-1.5 bg-rose-600/25 hover:bg-rose-600 border border-rose-500/40 text-rose-300 hover:text-white rounded-xl text-[11px] font-bold cursor-pointer">🚫 لغو + پیامک</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getAdminReservationFormCandidate() {
            const devId = document.getElementById('res-dev-id')?.value;
            const dev = devices.find(d => d.id === devId);
            const bookingType = document.getElementById('res-booking-type')?.value || 'online';
            const timeStr = document.getElementById('res-time')?.value || '17:00';
            const durMin = parseInt(normalizeDigits(document.getElementById('res-duration-min')?.value || '60'), 10) || 60;
            const sDay = document.getElementById('res-shamsi-day')?.value;
            const sMonth = document.getElementById('res-shamsi-month')?.value;
            const sYear = document.getElementById('res-shamsi-year')?.value;
            const dateKey = (sYear && sMonth && sDay) ? `${sYear}-${sMonth}-${sDay}` : getTodayDateKey();
            const startMin = MacanScheduler.parseTimeToMin(timeStr);
            if (startMin < 0 || !devId) return null;

            return MacanScheduler.buildUnifiedRecord({
                devId,
                devName: dev ? dev.name : devId,
                devType: dev ? dev.type : 'ps4',
                dateKey,
                customerName: document.getElementById('res-name')?.value.trim() || '',
                phone: document.getElementById('res-phone')?.value.trim() || '',
                bookingType,
                actualStartMin: startMin,
                actualEndMin: startMin + durMin,
                actualDurationMin: durMin,
                status: 'confirmed',
                openMin: operatingHours.openMin,
                closeMin: operatingHours.closeMin
            });
        }

        function updateAdminResPreview() {
            const cand = getAdminReservationFormCandidate();
            const alertEl = document.getElementById('res-conflict-alert');
            const btnEl = document.getElementById('res-submit-btn');
            if (!cand) return;

            const conflict = MacanScheduler.checkConflict(cand, getSchedulerContext());
            if (conflict.conflict) {
                if (alertEl) {
                    alertEl.textContent = '⚠️ ' + conflict.message;
                    alertEl.classList.remove('hidden');
                }
                if (btnEl) {
                    btnEl.disabled = true;
                    btnEl.classList.add('opacity-50', 'cursor-not-allowed');
                }
            } else {
                if (alertEl) alertEl.classList.add('hidden');
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }
        }

        function openReservationModal() {
            let modal = document.getElementById('reservation-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'reservation-modal';
                modal.className = 'fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden';
                document.body.appendChild(modal);
            }

            const todayParts = getShamsiParts();
            let daysOptions = '';
            for (let d = 1; d <= 31; d++) {
                const dPad = String(d).padStart(2, '0');
                daysOptions += `<option value="${dPad}" ${d === todayParts.day ? 'selected' : ''}>${d}</option>`;
            }
            let monthsOptions = persianMonths.map((mName, idx) => {
                const mPad = String(idx + 1).padStart(2, '0');
                return `<option value="${mPad}" ${(idx + 1) === todayParts.month ? 'selected' : ''}>${mName}</option>`;
            }).join('');
            const curYearNum = todayParts.year || 1405;
            let yearsOptions = [curYearNum, curYearNum + 1].map(y => `<option value="${y}">${y}</option>`).join('');

            let optionsHtml = devices.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

            modal.innerHTML = `
                <div class="glass-card w-full max-w-2xl rounded-3xl p-5 md:p-6 border border-indigo-500/40 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2">
                            <h3 class="font-black text-base text-indigo-300 flex items-center gap-2">
                                📅 پنل مدیریت رزرو مشتری‌ها
                            </h3>
                            <span id="res-filtered-count-badge" class="px-2.5 py-0.5 rounded-full bg-indigo-950 border border-indigo-500/40 text-indigo-300 font-mono text-[11px] font-bold">0 رزرو</span>
                        </div>
                        <button onclick="closeReservationModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                    </div>

                    <!-- ثبت رزرو جدید (جمع‌شونده برای خلوت ماندن لیست رزروها) -->
                    <details class="bg-slate-950/85 border border-cyan-500/35 rounded-2xl p-3.5 text-xs">
                        <summary class="font-black text-cyan-300 cursor-pointer select-none">➕ ثبت رزرو تلفنی یا حضوری جدید</summary>
                        <div class="space-y-3 pt-3 mt-2.5 border-t border-slate-800">
                            <datalist id="res-customers-datalist">${getCustomerDatalistOptions()}</datalist>
                            <datalist id="res-phones-datalist">${getCustomerPhoneDatalistOptions()}</datalist>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input type="text" id="res-name" list="res-customers-datalist" placeholder="نام مشتری" oninput="delete this.dataset.autoFilled; onCustomerNameInput(this.value, {nameId:'res-name', phoneId:'res-phone'})" onchange="onCustomerNameInput(this.value, {nameId:'res-name', phoneId:'res-phone'})" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-white">
                                <input type="tel" inputmode="tel" id="res-phone" list="res-phones-datalist" dir="ltr" oninput="delete this.dataset.autoFilled; onCustomerPhoneInput(this.value, {nameId:'res-name', phoneId:'res-phone'})" onchange="onCustomerPhoneInput(this.value, {nameId:'res-name', phoneId:'res-phone'})" placeholder="شماره تماس (0913...)" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-cyan-300 font-mono text-left">
                                <select id="res-dev-id" onchange="updateAdminResPreview()" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-white">
                                    ${optionsHtml}
                                </select>
                                <select id="res-booking-type" onchange="updateAdminResPreview()" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-cyan-300 font-bold">
                                    <option value="online">اینترنتی / تلفنی</option>
                                    <option value="walkin">حضوری (گرد به ۱۵ دقیقه بالا)</option>
                                </select>
                                <div class="sm:col-span-2">
                                    <label class="text-[10px] text-slate-400 block mb-1">زمان شروع (ساعت و دقیقه):</label>
                                    ${renderDigitalTimePicker('res-time', MacanScheduler.minToHHMM(getNowMinutes()), { showNow: true, onChange: 'updateAdminResPreview()' })}
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="text-[10px] text-slate-400 block mb-0.5">مدت بازی (دقیقه):</label>
                                    <input type="number" id="res-duration-min" value="60" min="15" max="480" step="15" oninput="updateAdminResPreview()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-emerald-300 font-mono text-center font-bold">
                                </div>
                                <div class="sm:col-span-2 flex flex-wrap items-center gap-1.5 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                                    <span class="text-slate-300 font-bold ml-1">تاریخ شمسی:</span>
                                    <select id="res-shamsi-day" onchange="updateAdminResPreview()" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-white font-mono">${daysOptions}</select>
                                    <select id="res-shamsi-month" onchange="updateAdminResPreview()" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-cyan-300 font-bold">${monthsOptions}</select>
                                    <select id="res-shamsi-year" onchange="updateAdminResPreview()" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-white font-mono">${yearsOptions}</select>
                                </div>
                            </div>
                            <div id="res-conflict-alert" class="hidden bg-rose-950/70 border border-rose-500/60 rounded-xl p-2.5 text-[11px] text-rose-200 font-bold"></div>
                            <button id="res-submit-btn" onclick="addReservation()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl cursor-pointer">ثبت قطعی رزرو</button>
                        </div>
                    </details>

                    <!-- فیلتر سریع بر اساس روز هفته یا تاریخ -->
                    <div class="space-y-2">
                        <div class="flex flex-wrap gap-1.5">
                            <button type="button" data-res-tab="all" onclick="setReservationFilterTab('all')" class="px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${activeResFilterTab === 'all' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-300 border border-slate-800'}">📋 همه رزروها</button>
                            <button type="button" data-res-tab="today" onclick="setReservationFilterTab('today')" class="px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${activeResFilterTab === 'today' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-300 border border-slate-800'}">📅 امروز</button>
                            <button type="button" data-res-tab="saturday" onclick="setReservationFilterTab('saturday')" class="px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${activeResFilterTab === 'saturday' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-300 border border-slate-800'}">شنبه</button>
                            <button type="button" data-res-tab="wednesday" onclick="setReservationFilterTab('wednesday')" class="px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${activeResFilterTab === 'wednesday' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-300 border border-slate-800'}">چهارشنبه</button>
                            <button type="button" data-res-tab="thursday" onclick="setReservationFilterTab('thursday')" class="px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${activeResFilterTab === 'thursday' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-300 border border-slate-800'}">پنج‌شنبه</button>
                            <button type="button" data-res-tab="custom" onclick="setReservationFilterTab('custom')" class="px-3 py-1.5 rounded-xl font-black text-[11px] transition cursor-pointer ${activeResFilterTab === 'custom' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-300 border border-slate-800'}">📆 تاریخ خاص</button>
                        </div>

                        <div id="res-custom-date-bar" class="${activeResFilterTab === 'custom' ? '' : 'hidden'} flex flex-wrap items-center gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs">
                            <span class="text-slate-400 font-bold ml-1">انتخاب تاریخ:</span>
                            <select id="res-filter-day" onchange="renderReservationModalList()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white font-mono">${daysOptions}</select>
                            <select id="res-filter-month" onchange="renderReservationModalList()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-cyan-300 font-bold">${monthsOptions}</select>
                            <select id="res-filter-year" onchange="renderReservationModalList()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white font-mono">${yearsOptions}</select>
                        </div>

                        <!-- جستجوی نام یا شماره تماس -->
                        <div class="flex items-center gap-2">

        function updateLiveClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = getShamsiFullDisplay(now);

            const clockEl = document.getElementById('header-live-clock');
            if (clockEl) {
                morphInto(clockEl, `
                    <span>${dateStr}</span>
                    <span>•</span>
                    <span class="font-mono font-bold text-slate-200">${timeStr}</span>
                `);
            }

            const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            if (azanAutoPauseEnabled && hhmm === azanTimeSetting && !azanAlertTriggeredToday) {
                azanAlertTriggeredToday = true;
                playChimeAlert();
                showToastNotification(`🔔 زمان اذان (${azanTimeSetting}) فرا رسید!`);
            } else if (hhmm !== azanTimeSetting) {
                azanAlertTriggeredToday = false;
            }

            let needsRender = false;
            const nowMs = Date.now();
            devices.forEach(dev => {
                if (dev.isActive && !dev.isPaused) {
                    if (dev.startTimestamp > 0) {
                        const realElapsed = dev.pausedAccumulatedSeconds + Math.floor((nowMs - dev.startTimestamp) / 1000);
                        if (realElapsed !== dev.elapsedSeconds) {
                            dev.elapsedSeconds = Math.max(0, realElapsed);
                            needsRender = true;
                        }
                    } else {
                        dev.startTimestamp = nowMs;
                    }
                    if (dev.limitHours > 0 && dev.elapsedSeconds >= dev.limitHours * 3600 && !dev.timeUp) {
                        dev.timeUp = true;
                        playChimeAlert();
                        showToastNotification(`⏰ زمان ${dev.name} به پایان رسید!`);
                        needsRender = true;
                    }
                }
            });

            if (needsRender) {
                renderAllDevices();
            }
        }

        function addExtraTime(devId, minutes) {
            const dev = devices.find(d => d.id === devId);
            if (!dev || !dev.isActive) return;

            const baseStart = typeof dev.actualStartMin === 'number' && dev.actualStartMin >= 0
                ? dev.actualStartMin
                : Math.max(0, getNowMinutes() - Math.floor((dev.elapsedSeconds || 0) / 60));
            const newLimitHours = (dev.limitHours || 0) + (minutes / 60);
            const newActualEnd = baseStart + Math.round(newLimitHours * 60);
            const newSchedStart = MacanScheduler.ceilTo15Minutes(baseStart);
            const newSchedEnd = MacanScheduler.ceilTo15Minutes(newActualEnd);

            const candidate = {
                id: dev.activeBookingId || ('live_' + dev.id),
                devId: dev.id,
                dateKey: getTodayDateKey(),
                bookingType: 'walkin',
                actualStartMin: baseStart,
                actualEndMin: newActualEnd,
                scheduledStartMin: newSchedStart,
                scheduledEndMin: newSchedEnd
            };

            const check = MacanScheduler.checkConflict(candidate, getSchedulerContext(), { ignoreBookingId: dev.activeBookingId || ('live_' + dev.id) });
            if (check.conflict) {
                showToastNotification(`⛔ امکان تمدید ${minutes} دقیقه نیست: ${check.message}`);
                return;
            }

            dev.limitHours = newLimitHours;
            dev.actualEndMin = newActualEnd;
            dev.scheduledEndMin = newSchedEnd;
            dev.endTime = MacanScheduler.minToHHMM(newActualEnd);
            dev.timeUp = false;

            if (dev.activeBookingId) {
                const rec = reservations.find(r => r.id === dev.activeBookingId);
                if (rec) {
                    rec.actualEndMin = newActualEnd;
                    rec.actualEndStr = MacanScheduler.minToHHMM(newActualEnd);
                    rec.actualDurationMin = newActualEnd - baseStart;
                    rec.scheduledEndMin = newSchedEnd;
                    rec.scheduledEndStr = MacanScheduler.minToHHMM(newSchedEnd);
                    rec.durationHours = newLimitHours;
                    rec.selectedSlots = MacanScheduler.getOverlappingSlotKeys(Math.min(baseStart, newSchedStart), newSchedEnd, operatingHours.openMin, operatingHours.closeMin);
                }
            }

            manualSaveAllData(true);
            renderAllDevices();
            showToastNotification(`${minutes}+ دقیقه به ${dev.name} اضافه شد (پایان برنامه‌ریزی: ${MacanScheduler.minToHHMM(newSchedEnd)}).`);
        }

        // --- Dedicated Debtors & Creditors Ledger Section ---
        let activeLedgerTab = 'all'; // 'all' | 'debtors' | 'creditors'

        function getLedgerSummaryStats() {
            let totalMoneyDebt = 0;
            let totalMoneyCredit = 0;
            let totalTimeCreditSecs = 0;
            let totalTimeDebtSecs = 0;
            let debtorsCount = 0;
            let creditorsCount = 0;
            const rows = [];

            Object.entries(customerDatabase).forEach(([key, cust]) => {
                if (!cust || !cust.name) return;
                const mBal = Number(cust.moneyBalance) || 0;
                const combinedTime = [...(cust.pendingDebts || []), ...(cust.debts || [])];
                const uniqueTime = [];
                const seen = new Set();
                combinedTime.forEach(d => {
                    if (d && !seen.has(d.id)) {
                        seen.add(d.id);
                        uniqueTime.push(d);
                    }
                });

                const creditSecs = uniqueTime.filter(t => t.recordType !== 'debt').reduce((s, t) => s + (Number(t.remainingSeconds) || 0), 0);
                const debtSecs = uniqueTime.filter(t => t.recordType === 'debt').reduce((s, t) => s + (Number(t.remainingSeconds) || 0), 0);

                const isDebtor = mBal < 0 || debtSecs > 0;
                const isCreditor = mBal > 0 || creditSecs > 0;

                if (mBal < 0) totalMoneyDebt += Math.abs(mBal);
                if (mBal > 0) totalMoneyCredit += mBal;
                totalTimeCreditSecs += creditSecs;
                totalTimeDebtSecs += debtSecs;

                if (isDebtor) debtorsCount++;
                if (isCreditor) creditorsCount++;

                if (isDebtor || isCreditor) {
                    rows.push({
                        key,
                        cust,
                        mBal,
                        creditSecs,
                        debtSecs,
                        uniqueTime,
                        isDebtor,
                        isCreditor
                    });
                }
            });

            return {
                totalMoneyDebt,
                totalMoneyCredit,
                totalTimeCreditSecs,
                totalTimeDebtSecs,
                debtorsCount,
                creditorsCount,
                rows
            };
        }

            const kind = document.getElementById('ded-ledger-kind')?.value;

            const note = (document.getElementById('ded-ledger-note')?.value || '').trim();
